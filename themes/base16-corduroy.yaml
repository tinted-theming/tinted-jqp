# vim: ft=yaml
# Scheme System: base16
# Scheme Name: Corduroy
# Scheme Author: taysatte (https://github.com/taysatte)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#e99d90"
    secondary: "# d27f91"
    error: "#e06278"
    inactive: "#887b8c"
    success: "#4b8686"
  chromaStyleOverrides:
    bg: "noinherit #cdc8d0 bg:#1d1920"
    "": "noinherit #cdc8d0"
    kc: "noinherit #c285b2" # Keyword.Constant
    kr: "noinherit #c285b2" # KeywordReserved
    kd: "noinherit #e06278" # KeywordDeclaration
    kn: "noinherit #e99d90" # KeywordNamespace
    kt: "noinherit #e06278" # KeywordType
    n: "noinherit #cdc8d0" # Name
    nc: "noinherit #edb392" # NameClass
    no: "noinherit #edb392" # NameConstant
    ne: "noinherit #e99d90" # NameException
    nf: "noinherit #887b8c" # NameFunction
    nl: "noinherit #e99d90" # NameLabel
    nn: "noinherit #e99d90" # NameNamespace
    py: "noinherit #e99d90" # NameProperty
    nt: "noinherit #e06278" # NameTag
    nv: "noinherit #cdc8d0" # NameVariable
    vc: "noinherit #cdc8d0" # NameVariableClass
    vg: "noinherit #cdc8d0" # NameVariableGlobal
    vi: "noinherit #cdc8d0" # NameVariableInstance
    na: "noinherit #887b8c" # NameAttribute
    nb: "noinherit #e99d90" # NameBuiltin
    nx: "noinherit #cdc8d0" # NameOther
    l: "noinherit #cdc8d0" # Literal
    s: "noinherit #4b8686" # LiteralString
    sc: "noinherit #4b8686" # LiteralStringChar
    s1: "noinherit #4b8686" # LiteralStringSingle
    s2: "noinherit #4b8686" # LiteralStringDouble
    sb: "noinherit #4b8686" # LiteralStringBacktick
    sx: "noinherit #4b8686" # LiteralStringOther
    si: "noinherit #4b8686" # LiteralStringInterpol
    sr: "noinherit #e99d90" # LiteralStringRegex
    sd: "noinherit #6f6373" # LiteralStringDoc
    sh: "noinherit #6f6373" # LiteralStringHeredoc
    m: "noinherit #e99d90" # LiteralNumber
    mb: "noinherit #e99d90" # LiteralNumberBin
    mh: "noinherit #e99d90" # LiteralNumberHex
    mi: "noinherit #e99d90" # LiteralNumberInteger
    mf: "noinherit #e99d90" # LiteralNumberFloat
    mo: "noinherit #e99d90" # LiteralNumberOct
    o: "noinherit bold #e99d90" # Operator
    ow: "noinherit bold #e99d90" # OperatorWord
    c: "noinherit italic #6f6373" # Comment
    cs: "noinherit italic #6f6373" # CommentSingle
    cm: "noinherit italic #6f6373" # CommentMultiline
    cx: "noinherit italic #6f6373" # CommentSpecial
    ch: "noinherit italic #6f6373" # CommentHashbang
    cp: "noinherit italic #6f6373" # CommentPreproc
