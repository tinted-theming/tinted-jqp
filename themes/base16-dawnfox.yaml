    kr: "noinherit #907aa9" # KeywordReserved
    kd: "noinherit #b4637a" # KeywordDeclaration
    kn: "noinherit #56949f" # KeywordNamespace
    kt: "noinherit #b4637a" # KeywordType
    n: "noinherit #575279" # Name
    nc: "noinherit #ea9d34" # NameClass
    no: "noinherit #ea9d34" # NameConstant
    ne: "noinherit #d7827e" # NameException
    nf: "noinherit #d685af" # NameFunction
    nl: "noinherit #56949f" # NameLabel
    nn: "noinherit #d7827e" # NameNamespace
    py: "noinherit #d7827e" # NameProperty
    nt: "noinherit #b4637a" # NameTag
    nv: "noinherit #625c87" # NameVariable
    vc: "noinherit #625c87" # NameVariableClass
    vg: "noinherit #625c87" # NameVariableGlobal
    vi: "noinherit #625c87" # NameVariableInstance
    na: "noinherit #d685af" # NameAttribute
    nb: "noinherit #56949f" # NameBuiltin
    nx: "noinherit #575279" # NameOther
    l: "noinherit #575279" # Literal
