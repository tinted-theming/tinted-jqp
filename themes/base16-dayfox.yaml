    c: "noinherit italic #534c45" # Comment
    cs: "noinherit italic #534c45" # CommentSingle
    cm: "noinherit italic #534c45" # CommentMultiline
    cx: "noinherit italic #534c45" # CommentSpecial
    ch: "noinherit italic #534c45" # CommentHashbang
    cp: "noinherit italic #534c45" # CommentPreproc
