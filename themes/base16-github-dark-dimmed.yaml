# vim: ft=yaml
# Scheme System: base16
# Scheme Name: Github Dark Dimmed
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#39c5cf"
    secondary: "# 539bf5"
    error: "#f47067"
    inactive: "#9198a1"
    success: "#57ab5a"
  chromaStyleOverrides:
    bg: "noinherit #d1d7e0 bg:#0d1117"
    "": "noinherit #d1d7e0"
    kc: "noinherit #b083f0" # Keyword.Constant
    kr: "noinherit #b083f0" # KeywordReserved
    kd: "noinherit #f47067" # KeywordDeclaration
    kn: "noinherit #39c5cf" # KeywordNamespace
    kt: "noinherit #f47067" # KeywordType
    n: "noinherit #d1d7e0" # Name
    nc: "noinherit #c69026" # NameClass
    no: "noinherit #c69026" # NameConstant
    ne: "noinherit #f69d50" # NameException
    nf: "noinherit #ff938a" # NameFunction
    nl: "noinherit #39c5cf" # NameLabel
    nn: "noinherit #f69d50" # NameNamespace
    py: "noinherit #f69d50" # NameProperty
    nt: "noinherit #f47067" # NameTag
    nv: "noinherit #f0f6fc" # NameVariable
    vc: "noinherit #f0f6fc" # NameVariableClass
    vg: "noinherit #f0f6fc" # NameVariableGlobal
    vi: "noinherit #f0f6fc" # NameVariableInstance
    na: "noinherit #ff938a" # NameAttribute
    nb: "noinherit #39c5cf" # NameBuiltin
    nx: "noinherit #d1d7e0" # NameOther
    l: "noinherit #d1d7e0" # Literal
    s: "noinherit #57ab5a" # LiteralString
    sc: "noinherit #57ab5a" # LiteralStringChar
    s1: "noinherit #57ab5a" # LiteralStringSingle
    s2: "noinherit #57ab5a" # LiteralStringDouble
    sb: "noinherit #57ab5a" # LiteralStringBacktick
    sx: "noinherit #57ab5a" # LiteralStringOther
    si: "noinherit #57ab5a" # LiteralStringInterpol
    sr: "noinherit #39c5cf" # LiteralStringRegex
    sd: "noinherit #656c76" # LiteralStringDoc
    sh: "noinherit #656c76" # LiteralStringHeredoc
    m: "noinherit #f69d50" # LiteralNumber
    mb: "noinherit #f69d50" # LiteralNumberBin
    mh: "noinherit #f69d50" # LiteralNumberHex
    mi: "noinherit #f69d50" # LiteralNumberInteger
    mf: "noinherit #f69d50" # LiteralNumberFloat
    mo: "noinherit #f69d50" # LiteralNumberOct
    o: "noinherit bold #39c5cf" # Operator
    ow: "noinherit bold #39c5cf" # OperatorWord
    c: "noinherit italic #656c76" # Comment
    cs: "noinherit italic #656c76" # CommentSingle
    cm: "noinherit italic #656c76" # CommentMultiline
    cx: "noinherit italic #656c76" # CommentSpecial
    ch: "noinherit italic #656c76" # CommentHashbang
    cp: "noinherit italic #656c76" # CommentPreproc
