# vim: ft=yaml
# Scheme System: base16
# Scheme Name: Github Dark
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#39c5cf"
    secondary: "# 58a6ff"
    error: "#ff7b72"
    inactive: "#9198a1"
    success: "#3fb950"
  chromaStyleOverrides:
    bg: "noinherit #d1d7e0 bg:#0d1117"
    "": "noinherit #d1d7e0"
    kc: "noinherit #be8fff" # Keyword.Constant
    kr: "noinherit #be8fff" # KeywordReserved
    kd: "noinherit #ff7b72" # KeywordDeclaration
    kn: "noinherit #39c5cf" # KeywordNamespace
    kt: "noinherit #ff7b72" # KeywordType
    n: "noinherit #d1d7e0" # Name
    nc: "noinherit #d29922" # NameClass
    no: "noinherit #d29922" # NameConstant
    ne: "noinherit #ffa657" # NameException
    nf: "noinherit #ffa198" # NameFunction
    nl: "noinherit #39c5cf" # NameLabel
    nn: "noinherit #ffa657" # NameNamespace
    py: "noinherit #ffa657" # NameProperty
    nt: "noinherit #ff7b72" # NameTag
    nv: "noinherit #f0f6fc" # NameVariable
    vc: "noinherit #f0f6fc" # NameVariableClass
    vg: "noinherit #f0f6fc" # NameVariableGlobal
    vi: "noinherit #f0f6fc" # NameVariableInstance
    na: "noinherit #ffa198" # NameAttribute
    nb: "noinherit #39c5cf" # NameBuiltin
    nx: "noinherit #d1d7e0" # NameOther
    l: "noinherit #d1d7e0" # Literal
    s: "noinherit #3fb950" # LiteralString
    sc: "noinherit #3fb950" # LiteralStringChar
    s1: "noinherit #3fb950" # LiteralStringSingle
    s2: "noinherit #3fb950" # LiteralStringDouble
    sb: "noinherit #3fb950" # LiteralStringBacktick
    sx: "noinherit #3fb950" # LiteralStringOther
    si: "noinherit #3fb950" # LiteralStringInterpol
    sr: "noinherit #39c5cf" # LiteralStringRegex
    sd: "noinherit #656c76" # LiteralStringDoc
    sh: "noinherit #656c76" # LiteralStringHeredoc
    m: "noinherit #ffa657" # LiteralNumber
    mb: "noinherit #ffa657" # LiteralNumberBin
    mh: "noinherit #ffa657" # LiteralNumberHex
    mi: "noinherit #ffa657" # LiteralNumberInteger
    mf: "noinherit #ffa657" # LiteralNumberFloat
    mo: "noinherit #ffa657" # LiteralNumberOct
    o: "noinherit bold #39c5cf" # Operator
    ow: "noinherit bold #39c5cf" # OperatorWord
    c: "noinherit italic #656c76" # Comment
    cs: "noinherit italic #656c76" # CommentSingle
    cm: "noinherit italic #656c76" # CommentMultiline
    cx: "noinherit italic #656c76" # CommentSpecial
    ch: "noinherit italic #656c76" # CommentHashbang
    cp: "noinherit italic #656c76" # CommentPreproc
