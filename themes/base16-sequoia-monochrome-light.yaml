# vim: ft=yaml
# Scheme System: base16
# Scheme Name: Sequoia Monochrome Light
# Scheme Author: Micheal Andreuzza (https://michaelandreuzza.com/)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#454752"
    secondary: "# 5f6370"
    error: "#525666"
    inactive: "#42434e"
    success: "#2e3038"
  chromaStyleOverrides:
    bg: "noinherit #282930 bg:#edeef2"
    "": "noinherit #282930"
    kc: "noinherit #50535e" # Keyword.Constant
    kr: "noinherit #50535e" # KeywordReserved
    kd: "noinherit #525666" # KeywordDeclaration
    kn: "noinherit #454752" # KeywordNamespace
    kt: "noinherit #525666" # KeywordType
    n: "noinherit #282930" # Name
    nc: "noinherit #50535e" # NameClass
    no: "noinherit #50535e" # NameConstant
    ne: "noinherit #525666" # NameException
    nf: "noinherit #2e3038" # NameFunction
    nl: "noinherit #454752" # NameLabel
    nn: "noinherit #525666" # NameNamespace
    py: "noinherit #525666" # NameProperty
    nt: "noinherit #525666" # NameTag
    nv: "noinherit #282930" # NameVariable
    vc: "noinherit #282930" # NameVariableClass
    vg: "noinherit #282930" # NameVariableGlobal
    vi: "noinherit #282930" # NameVariableInstance
    na: "noinherit #2e3038" # NameAttribute
    nb: "noinherit #454752" # NameBuiltin
    nx: "noinherit #282930" # NameOther
    l: "noinherit #282930" # Literal
    s: "noinherit #2e3038" # LiteralString
    sc: "noinherit #2e3038" # LiteralStringChar
    s1: "noinherit #2e3038" # LiteralStringSingle
    s2: "noinherit #2e3038" # LiteralStringDouble
    sb: "noinherit #2e3038" # LiteralStringBacktick
    sx: "noinherit #2e3038" # LiteralStringOther
    si: "noinherit #2e3038" # LiteralStringInterpol
    sr: "noinherit #454752" # LiteralStringRegex
    sd: "noinherit #9da2ad" # LiteralStringDoc
    sh: "noinherit #9da2ad" # LiteralStringHeredoc
    m: "noinherit #525666" # LiteralNumber
    mb: "noinherit #525666" # LiteralNumberBin
    mh: "noinherit #525666" # LiteralNumberHex
    mi: "noinherit #525666" # LiteralNumberInteger
    mf: "noinherit #525666" # LiteralNumberFloat
    mo: "noinherit #525666" # LiteralNumberOct
    o: "noinherit bold #454752" # Operator
    ow: "noinherit bold #454752" # OperatorWord
    c: "noinherit italic #9da2ad" # Comment
    cs: "noinherit italic #9da2ad" # CommentSingle
    cm: "noinherit italic #9da2ad" # CommentMultiline
    cx: "noinherit italic #9da2ad" # CommentSpecial
    ch: "noinherit italic #9da2ad" # CommentHashbang
    cp: "noinherit italic #9da2ad" # CommentPreproc
