# vim: ft=yaml
# Scheme System: base16
# Scheme Name: Stranger Theme Hawkins
# Scheme Author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#88c0d0"
    secondary: "# b48ead"
    error: "#bf616a"
    inactive: "#b8ac98"
    success: "#a3be8c"
  chromaStyleOverrides:
    bg: "noinherit #e8dcc8 bg:#2c2218"
    "": "noinherit #e8dcc8"
    kc: "noinherit #d4a574" # Keyword.Constant
    kr: "noinherit #d4a574" # KeywordReserved
    kd: "noinherit #bf616a" # KeywordDeclaration
    kn: "noinherit #88c0d0" # KeywordNamespace
    kt: "noinherit #bf616a" # KeywordType
    n: "noinherit #e8dcc8" # Name
    nc: "noinherit #ebcb8b" # NameClass
    no: "noinherit #ebcb8b" # NameConstant
    ne: "noinherit #d08770" # NameException
    nf: "noinherit #a85f48" # NameFunction
    nl: "noinherit #88c0d0" # NameLabel
    nn: "noinherit #d08770" # NameNamespace
    py: "noinherit #d08770" # NameProperty
    nt: "noinherit #bf616a" # NameTag
    nv: "noinherit #f4e8d4" # NameVariable
    vc: "noinherit #f4e8d4" # NameVariableClass
    vg: "noinherit #f4e8d4" # NameVariableGlobal
    vi: "noinherit #f4e8d4" # NameVariableInstance
    na: "noinherit #a85f48" # NameAttribute
    nb: "noinherit #88c0d0" # NameBuiltin
    nx: "noinherit #e8dcc8" # NameOther
    l: "noinherit #e8dcc8" # Literal
    s: "noinherit #a3be8c" # LiteralString
    sc: "noinherit #a3be8c" # LiteralStringChar
    s1: "noinherit #a3be8c" # LiteralStringSingle
    s2: "noinherit #a3be8c" # LiteralStringDouble
    sb: "noinherit #a3be8c" # LiteralStringBacktick
    sx: "noinherit #a3be8c" # LiteralStringOther
    si: "noinherit #a3be8c" # LiteralStringInterpol
    sr: "noinherit #88c0d0" # LiteralStringRegex
    sd: "noinherit #9e8766" # LiteralStringDoc
    sh: "noinherit #9e8766" # LiteralStringHeredoc
    m: "noinherit #d08770" # LiteralNumber
    mb: "noinherit #d08770" # LiteralNumberBin
    mh: "noinherit #d08770" # LiteralNumberHex
    mi: "noinherit #d08770" # LiteralNumberInteger
    mf: "noinherit #d08770" # LiteralNumberFloat
    mo: "noinherit #d08770" # LiteralNumberOct
    o: "noinherit bold #88c0d0" # Operator
    ow: "noinherit bold #88c0d0" # OperatorWord
    c: "noinherit italic #9e8766" # Comment
    cs: "noinherit italic #9e8766" # CommentSingle
    cm: "noinherit italic #9e8766" # CommentMultiline
    cx: "noinherit italic #9e8766" # CommentSpecial
    ch: "noinherit italic #9e8766" # CommentHashbang
    cp: "noinherit italic #9e8766" # CommentPreproc
