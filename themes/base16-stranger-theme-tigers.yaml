# vim: ft=yaml
# Scheme System: base16
# Scheme Name: Stranger Theme Tigers
# Scheme Author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#8abeb7"
    secondary: "# 81a2be"
    error: "#cc6666"
    inactive: "#c5c5c5"
    success: "#b5bd68"
  chromaStyleOverrides:
    bg: "noinherit #f5f5f5 bg:#181e18"
    "": "noinherit #f5f5f5"
    kc: "noinherit #b294bb" # Keyword.Constant
    kr: "noinherit #b294bb" # KeywordReserved
    kd: "noinherit #cc6666" # KeywordDeclaration
    kn: "noinherit #8abeb7" # KeywordNamespace
    kt: "noinherit #cc6666" # KeywordType
    n: "noinherit #f5f5f5" # Name
    nc: "noinherit #f0c674" # NameClass
    no: "noinherit #f0c674" # NameConstant
    ne: "noinherit #de935f" # NameException
    nf: "noinherit #b66b37" # NameFunction
    nl: "noinherit #8abeb7" # NameLabel
    nn: "noinherit #de935f" # NameNamespace
    py: "noinherit #de935f" # NameProperty
    nt: "noinherit #cc6666" # NameTag
    nv: "noinherit #ffffff" # NameVariable
    vc: "noinherit #ffffff" # NameVariableClass
    vg: "noinherit #ffffff" # NameVariableGlobal
    vi: "noinherit #ffffff" # NameVariableInstance
    na: "noinherit #b66b37" # NameAttribute
    nb: "noinherit #8abeb7" # NameBuiltin
    nx: "noinherit #f5f5f5" # NameOther
    l: "noinherit #f5f5f5" # Literal
    s: "noinherit #b5bd68" # LiteralString
    sc: "noinherit #b5bd68" # LiteralStringChar
    s1: "noinherit #b5bd68" # LiteralStringSingle
    s2: "noinherit #b5bd68" # LiteralStringDouble
    sb: "noinherit #b5bd68" # LiteralStringBacktick
    sx: "noinherit #b5bd68" # LiteralStringOther
    si: "noinherit #b5bd68" # LiteralStringInterpol
    sr: "noinherit #8abeb7" # LiteralStringRegex
    sd: "noinherit #758975" # LiteralStringDoc
    sh: "noinherit #758975" # LiteralStringHeredoc
    m: "noinherit #de935f" # LiteralNumber
    mb: "noinherit #de935f" # LiteralNumberBin
    mh: "noinherit #de935f" # LiteralNumberHex
    mi: "noinherit #de935f" # LiteralNumberInteger
    mf: "noinherit #de935f" # LiteralNumberFloat
    mo: "noinherit #de935f" # LiteralNumberOct
    o: "noinherit bold #8abeb7" # Operator
    ow: "noinherit bold #8abeb7" # OperatorWord
    c: "noinherit italic #758975" # Comment
    cs: "noinherit italic #758975" # CommentSingle
    cm: "noinherit italic #758975" # CommentMultiline
    cx: "noinherit italic #758975" # CommentSpecial
    ch: "noinherit italic #758975" # CommentHashbang
    cp: "noinherit italic #758975" # CommentPreproc
