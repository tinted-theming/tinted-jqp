# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Apprentice
# Scheme Author: Romain Lafourcade (https://github.com/romainl)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#5f8787"
    secondary: "# 5f87af"
    error: "#af5f5f"
    inactive: "#6c6c6c"
    success: "#5f875f"
  chromaStyleOverrides:
    bg: "noinherit #bcbcbc bg:#262626"
    "": "noinherit #bcbcbc"
    kc: "noinherit #5f5f87" # Keyword.Constant
    kr: "noinherit #5f5f87" # KeywordReserved
    kd: "noinherit #ff8700" # KeywordDeclaration
    kn: "noinherit #5f8787" # KeywordNamespace
    kt: "noinherit #ff8700" # KeywordType
    n: "noinherit #bcbcbc" # Name
    nc: "noinherit #87875f" # NameClass
    no: "noinherit #87875f" # NameConstant
    ne: "noinherit #ff8700" # NameException
    nf: "noinherit #af5f5f" # NameFunction
    nl: "noinherit #5fafaf" # NameLabel
    nn: "noinherit #ff8700" # NameNamespace
    py: "noinherit #ff8700" # NameProperty
    nt: "noinherit #af5f5f" # NameTag
    nv: "noinherit #dfdfdf" # NameVariable
    vc: "noinherit #dfdfdf" # NameVariableClass
    vg: "noinherit #dfdfdf" # NameVariableGlobal
    vi: "noinherit #dfdfdf" # NameVariableInstance
    na: "noinherit #af5f5f" # NameAttribute
    nb: "noinherit #5fafaf" # NameBuiltin
    nx: "noinherit #bcbcbc" # NameOther
    l: "noinherit #bcbcbc" # Literal
    s: "noinherit #5f875f" # LiteralString
    sc: "noinherit #5f875f" # LiteralStringChar
    s1: "noinherit #5f875f" # LiteralStringSingle
    s2: "noinherit #5f875f" # LiteralStringDouble
    sb: "noinherit #5f875f" # LiteralStringBacktick
    sx: "noinherit #5f875f" # LiteralStringOther
    si: "noinherit #5f875f" # LiteralStringInterpol
    sr: "noinherit #5f8787" # LiteralStringRegex
    sd: "noinherit #444444" # LiteralStringDoc
    sh: "noinherit #444444" # LiteralStringHeredoc
    m: "noinherit #ff8700" # LiteralNumber
    mb: "noinherit #ff8700" # LiteralNumberBin
    mh: "noinherit #ff8700" # LiteralNumberHex
    mi: "noinherit #ff8700" # LiteralNumberInteger
    mf: "noinherit #ff8700" # LiteralNumberFloat
    mo: "noinherit #ff8700" # LiteralNumberOct
    o: "noinherit bold #5fafaf" # Operator
    ow: "noinherit bold #5fafaf" # OperatorWord
    c: "noinherit italic #444444" # Comment
    cs: "noinherit italic #444444" # CommentSingle
    cm: "noinherit italic #444444" # CommentMultiline
    cx: "noinherit italic #444444" # CommentSpecial
    ch: "noinherit italic #444444" # CommentHashbang
    cp: "noinherit italic #444444" # CommentPreproc
