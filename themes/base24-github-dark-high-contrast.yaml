# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Github Dark High Contrast
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#39c5cf"
    secondary: "# 71b7ff"
    error: "#ff9492"
    inactive: "#9198a1"
    success: "#28d751"
  chromaStyleOverrides:
    bg: "noinherit #d1d7e0 bg:#0d1117"
    "": "noinherit #d1d7e0"
    kc: "noinherit #cb9eff" # Keyword.Constant
    kr: "noinherit #cb9eff" # KeywordReserved
    kd: "noinherit #ffb1af" # KeywordDeclaration
    kn: "noinherit #39c5cf" # KeywordNamespace
    kt: "noinherit #ffb1af" # KeywordType
    n: "noinherit #d1d7e0" # Name
    nc: "noinherit #f0b72f" # NameClass
    no: "noinherit #f0b72f" # NameConstant
    ne: "noinherit #ffb757" # NameException
    nf: "noinherit #ffb1af" # NameFunction
    nl: "noinherit #56d4dd" # NameLabel
    nn: "noinherit #ffb757" # NameNamespace
    py: "noinherit #ffb757" # NameProperty
    nt: "noinherit #ff9492" # NameTag
    nv: "noinherit #f0f6fc" # NameVariable
    vc: "noinherit #f0f6fc" # NameVariableClass
    vg: "noinherit #f0f6fc" # NameVariableGlobal
    vi: "noinherit #f0f6fc" # NameVariableInstance
    na: "noinherit #ffb1af" # NameAttribute
    nb: "noinherit #56d4dd" # NameBuiltin
    nx: "noinherit #d1d7e0" # NameOther
    l: "noinherit #d1d7e0" # Literal
    s: "noinherit #28d751" # LiteralString
    sc: "noinherit #28d751" # LiteralStringChar
    s1: "noinherit #28d751" # LiteralStringSingle
    s2: "noinherit #28d751" # LiteralStringDouble
    sb: "noinherit #28d751" # LiteralStringBacktick
    sx: "noinherit #28d751" # LiteralStringOther
    si: "noinherit #28d751" # LiteralStringInterpol
    sr: "noinherit #39c5cf" # LiteralStringRegex
    sd: "noinherit #656c76" # LiteralStringDoc
    sh: "noinherit #656c76" # LiteralStringHeredoc
    m: "noinherit #ffb757" # LiteralNumber
    mb: "noinherit #ffb757" # LiteralNumberBin
    mh: "noinherit #ffb757" # LiteralNumberHex
    mi: "noinherit #ffb757" # LiteralNumberInteger
    mf: "noinherit #ffb757" # LiteralNumberFloat
    mo: "noinherit #ffb757" # LiteralNumberOct
    o: "noinherit bold #56d4dd" # Operator
    ow: "noinherit bold #56d4dd" # OperatorWord
    c: "noinherit italic #656c76" # Comment
    cs: "noinherit italic #656c76" # CommentSingle
    cm: "noinherit italic #656c76" # CommentMultiline
    cx: "noinherit italic #656c76" # CommentSpecial
    ch: "noinherit italic #656c76" # CommentHashbang
    cp: "noinherit italic #656c76" # CommentPreproc
