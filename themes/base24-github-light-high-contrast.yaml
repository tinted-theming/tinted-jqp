# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Github Light High Contrast
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#1b7c83"
    secondary: "# 0349b4"
    error: "#a0111f"
    inactive: "#59636e"
    success: "#024c1a"
  chromaStyleOverrides:
    bg: "noinherit #454c54 bg:#ffffff"
    "": "noinherit #454c54"
    kc: "noinherit #622cbc" # Keyword.Constant
    kr: "noinherit #622cbc" # KeywordReserved
    kd: "noinherit #86061d" # KeywordDeclaration
    kn: "noinherit #1b7c83" # KeywordNamespace
    kt: "noinherit #86061d" # KeywordType
    n: "noinherit #454c54" # Name
    nc: "noinherit #603700" # NameClass
    no: "noinherit #603700" # NameConstant
    ne: "noinherit #702c00" # NameException
    nf: "noinherit #86061d" # NameFunction
    nl: "noinherit #3192aa" # NameLabel
    nn: "noinherit #702c00" # NameNamespace
    py: "noinherit #702c00" # NameProperty
    nt: "noinherit #a0111f" # NameTag
    nv: "noinherit #25292e" # NameVariable
    vc: "noinherit #25292e" # NameVariableClass
    vg: "noinherit #25292e" # NameVariableGlobal
    vi: "noinherit #25292e" # NameVariableInstance
    na: "noinherit #86061d" # NameAttribute
    nb: "noinherit #3192aa" # NameBuiltin
    nx: "noinherit #454c54" # NameOther
    l: "noinherit #454c54" # Literal
    s: "noinherit #024c1a" # LiteralString
    sc: "noinherit #024c1a" # LiteralStringChar
    s1: "noinherit #024c1a" # LiteralStringSingle
    s2: "noinherit #024c1a" # LiteralStringDouble
    sb: "noinherit #024c1a" # LiteralStringBacktick
    sx: "noinherit #024c1a" # LiteralStringOther
    si: "noinherit #024c1a" # LiteralStringInterpol
    sr: "noinherit #1b7c83" # LiteralStringRegex
    sd: "noinherit #818b98" # LiteralStringDoc
    sh: "noinherit #818b98" # LiteralStringHeredoc
    m: "noinherit #702c00" # LiteralNumber
    mb: "noinherit #702c00" # LiteralNumberBin
    mh: "noinherit #702c00" # LiteralNumberHex
    mi: "noinherit #702c00" # LiteralNumberInteger
    mf: "noinherit #702c00" # LiteralNumberFloat
    mo: "noinherit #702c00" # LiteralNumberOct
    o: "noinherit bold #3192aa" # Operator
    ow: "noinherit bold #3192aa" # OperatorWord
    c: "noinherit italic #818b98" # Comment
    cs: "noinherit italic #818b98" # CommentSingle
    cm: "noinherit italic #818b98" # CommentMultiline
    cx: "noinherit italic #818b98" # CommentSpecial
    ch: "noinherit italic #818b98" # CommentHashbang
    cp: "noinherit italic #818b98" # CommentPreproc
