# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Github Light
# Scheme Author: Tinted Theming (https://github.com/tinted-theming)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#1b7c83"
    secondary: "# 0969da"
    error: "#cf222e"
    inactive: "#59636e"
    success: "#116329"
  chromaStyleOverrides:
    bg: "noinherit #454c54 bg:#ffffff"
    "": "noinherit #454c54"
    kc: "noinherit #8250df" # Keyword.Constant
    kr: "noinherit #8250df" # KeywordReserved
    kd: "noinherit #a40e26" # KeywordDeclaration
    kn: "noinherit #1b7c83" # KeywordNamespace
    kt: "noinherit #a40e26" # KeywordType
    n: "noinherit #454c54" # Name
    nc: "noinherit #9a6700" # NameClass
    no: "noinherit #9a6700" # NameConstant
    ne: "noinherit #953800" # NameException
    nf: "noinherit #a40e26" # NameFunction
    nl: "noinherit #3192aa" # NameLabel
    nn: "noinherit #953800" # NameNamespace
    py: "noinherit #953800" # NameProperty
    nt: "noinherit #cf222e" # NameTag
    nv: "noinherit #25292e" # NameVariable
    vc: "noinherit #25292e" # NameVariableClass
    vg: "noinherit #25292e" # NameVariableGlobal
    vi: "noinherit #25292e" # NameVariableInstance
    na: "noinherit #a40e26" # NameAttribute
    nb: "noinherit #3192aa" # NameBuiltin
    nx: "noinherit #454c54" # NameOther
    l: "noinherit #454c54" # Literal
    s: "noinherit #116329" # LiteralString
    sc: "noinherit #116329" # LiteralStringChar
    s1: "noinherit #116329" # LiteralStringSingle
    s2: "noinherit #116329" # LiteralStringDouble
    sb: "noinherit #116329" # LiteralStringBacktick
    sx: "noinherit #116329" # LiteralStringOther
    si: "noinherit #116329" # LiteralStringInterpol
    sr: "noinherit #1b7c83" # LiteralStringRegex
    sd: "noinherit #818b98" # LiteralStringDoc
    sh: "noinherit #818b98" # LiteralStringHeredoc
    m: "noinherit #953800" # LiteralNumber
    mb: "noinherit #953800" # LiteralNumberBin
    mh: "noinherit #953800" # LiteralNumberHex
    mi: "noinherit #953800" # LiteralNumberInteger
    mf: "noinherit #953800" # LiteralNumberFloat
    mo: "noinherit #953800" # LiteralNumberOct
    o: "noinherit bold #3192aa" # Operator
    ow: "noinherit bold #3192aa" # OperatorWord
    c: "noinherit italic #818b98" # Comment
    cs: "noinherit italic #818b98" # CommentSingle
    cm: "noinherit italic #818b98" # CommentMultiline
    cx: "noinherit italic #818b98" # CommentSpecial
    ch: "noinherit italic #818b98" # CommentHashbang
    cp: "noinherit italic #818b98" # CommentPreproc
