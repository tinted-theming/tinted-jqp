# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Aurora Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#84d2db"
    secondary: "# c5d8ed"
    error: "#d86f66"
    inactive: "#5a6d6d"
    success: "#6cd79d"
  chromaStyleOverrides:
    bg: "noinherit #d6e3e2 bg:#041212"
    "": "noinherit #d6e3e2"
    kc: "noinherit #bf9ef1" # Keyword.Constant
    kr: "noinherit #bf9ef1" # KeywordReserved
    kd: "noinherit #e59289" # KeywordDeclaration
    kn: "noinherit #84d2db" # KeywordNamespace
    kt: "noinherit #e59289" # KeywordType
    n: "noinherit #d6e3e2" # Name
    nc: "noinherit #e9d487" # NameClass
    no: "noinherit #e9d487" # NameConstant
    ne: "noinherit #fcb07c" # NameException
    nf: "noinherit #e7ade1" # NameFunction
    nl: "noinherit #9decf6" # NameLabel
    nn: "noinherit #fcb07c" # NameNamespace
    py: "noinherit #fcb07c" # NameProperty
    nt: "noinherit #d86f66" # NameTag
    nv: "noinherit #a7b4b4" # NameVariable
    vc: "noinherit #a7b4b4" # NameVariableClass
    vg: "noinherit #a7b4b4" # NameVariableGlobal
    vi: "noinherit #a7b4b4" # NameVariableInstance
    na: "noinherit #e7ade1" # NameAttribute
    nb: "noinherit #9decf6" # NameBuiltin
    nx: "noinherit #d6e3e2" # NameOther
    l: "noinherit #d6e3e2" # Literal
    s: "noinherit #6cd79d" # LiteralString
    sc: "noinherit #6cd79d" # LiteralStringChar
    s1: "noinherit #6cd79d" # LiteralStringSingle
    s2: "noinherit #6cd79d" # LiteralStringDouble
    sb: "noinherit #6cd79d" # LiteralStringBacktick
    sx: "noinherit #6cd79d" # LiteralStringOther
    si: "noinherit #6cd79d" # LiteralStringInterpol
    sr: "noinherit #84d2db" # LiteralStringRegex
    sd: "noinherit #182a2a" # LiteralStringDoc
    sh: "noinherit #182a2a" # LiteralStringHeredoc
    m: "noinherit #fcb07c" # LiteralNumber
    mb: "noinherit #fcb07c" # LiteralNumberBin
    mh: "noinherit #fcb07c" # LiteralNumberHex
    mi: "noinherit #fcb07c" # LiteralNumberInteger
    mf: "noinherit #fcb07c" # LiteralNumberFloat
    mo: "noinherit #fcb07c" # LiteralNumberOct
    o: "noinherit bold #9decf6" # Operator
    ow: "noinherit bold #9decf6" # OperatorWord
    c: "noinherit italic #182a2a" # Comment
    cs: "noinherit italic #182a2a" # CommentSingle
    cm: "noinherit italic #182a2a" # CommentMultiline
    cx: "noinherit italic #182a2a" # CommentSpecial
    ch: "noinherit italic #182a2a" # CommentHashbang
    cp: "noinherit italic #182a2a" # CommentPreproc
