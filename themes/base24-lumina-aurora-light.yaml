# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Aurora Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007386"
    secondary: "# 425b7a"
    error: "#942a28"
    inactive: "#7e8987"
    success: "#026d43"
  chromaStyleOverrides:
    bg: "noinherit #163236 bg:#f2faf9"
    "": "noinherit #163236"
    kc: "noinherit #754fa5" # Keyword.Constant
    kr: "noinherit #754fa5" # KeywordReserved
    kd: "noinherit #6d2926" # KeywordDeclaration
    kn: "noinherit #007386" # KeywordNamespace
    kt: "noinherit #6d2926" # KeywordType
    n: "noinherit #163236" # Name
    nc: "noinherit #9f6116" # NameClass
    no: "noinherit #9f6116" # NameConstant
    ne: "noinherit #985022" # NameException
    nf: "noinherit #894c84" # NameFunction
    nl: "noinherit #005d6d" # NameLabel
    nn: "noinherit #985022" # NameNamespace
    py: "noinherit #985022" # NameProperty
    nt: "noinherit #942a28" # NameTag
    nv: "noinherit #414a49" # NameVariable
    vc: "noinherit #414a49" # NameVariableClass
    vg: "noinherit #414a49" # NameVariableGlobal
    vi: "noinherit #414a49" # NameVariableInstance
    na: "noinherit #894c84" # NameAttribute
    nb: "noinherit #005d6d" # NameBuiltin
    nx: "noinherit #163236" # NameOther
    l: "noinherit #163236" # Literal
    s: "noinherit #026d43" # LiteralString
    sc: "noinherit #026d43" # LiteralStringChar
    s1: "noinherit #026d43" # LiteralStringSingle
    s2: "noinherit #026d43" # LiteralStringDouble
    sb: "noinherit #026d43" # LiteralStringBacktick
    sx: "noinherit #026d43" # LiteralStringOther
    si: "noinherit #026d43" # LiteralStringInterpol
    sr: "noinherit #007386" # LiteralStringRegex
    sd: "noinherit #cdd8d7" # LiteralStringDoc
    sh: "noinherit #cdd8d7" # LiteralStringHeredoc
    m: "noinherit #985022" # LiteralNumber
