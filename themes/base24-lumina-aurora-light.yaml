    mh: "noinherit #985022" # LiteralNumberHex
    mi: "noinherit #985022" # LiteralNumberInteger
    mf: "noinherit #985022" # LiteralNumberFloat
    mo: "noinherit #985022" # LiteralNumberOct
    o: "noinherit bold #005d6d" # Operator
