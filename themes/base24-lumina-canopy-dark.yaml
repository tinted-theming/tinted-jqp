# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Canopy Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#86cfd7"
    secondary: "# 9acaf1"
    error: "#d57068"
    inactive: "#5b6f5f"
    success: "#99d0a4"
  chromaStyleOverrides:
    bg: "noinherit #d8e3d6 bg:#0c1b10"
    "": "noinherit #d8e3d6"
    kc: "noinherit #bfb8f3" # Keyword.Constant
    kr: "noinherit #bfb8f3" # KeywordReserved
    kd: "noinherit #e1928b" # KeywordDeclaration
    kn: "noinherit #86cfd7" # KeywordNamespace
    kt: "noinherit #e1928b" # KeywordType
    n: "noinherit #d8e3d6" # Name
    nc: "noinherit #d1cca8" # NameClass
    no: "noinherit #d1cca8" # NameConstant
    ne: "noinherit #f6ae7c" # NameException
    nf: "noinherit #e2acdd" # NameFunction
    nl: "noinherit #9fe9f1" # NameLabel
    nn: "noinherit #f6ae7c" # NameNamespace
    py: "noinherit #f6ae7c" # NameProperty
    nt: "noinherit #d57068" # NameTag
    nv: "noinherit #a8b5aa" # NameVariable
    vc: "noinherit #a8b5aa" # NameVariableClass
    vg: "noinherit #a8b5aa" # NameVariableGlobal
    vi: "noinherit #a8b5aa" # NameVariableInstance
    na: "noinherit #e2acdd" # NameAttribute
    nb: "noinherit #9fe9f1" # NameBuiltin
    nx: "noinherit #d8e3d6" # NameOther
    l: "noinherit #d8e3d6" # Literal
    s: "noinherit #99d0a4" # LiteralString
    sc: "noinherit #99d0a4" # LiteralStringChar
    s1: "noinherit #99d0a4" # LiteralStringSingle
    s2: "noinherit #99d0a4" # LiteralStringDouble
    sb: "noinherit #99d0a4" # LiteralStringBacktick
    sx: "noinherit #99d0a4" # LiteralStringOther
    si: "noinherit #99d0a4" # LiteralStringInterpol
    sr: "noinherit #86cfd7" # LiteralStringRegex
    sd: "noinherit #223427" # LiteralStringDoc
    sh: "noinherit #223427" # LiteralStringHeredoc
    m: "noinherit #f6ae7c" # LiteralNumber
    mb: "noinherit #f6ae7c" # LiteralNumberBin
    mh: "noinherit #f6ae7c" # LiteralNumberHex
    mi: "noinherit #f6ae7c" # LiteralNumberInteger
    mf: "noinherit #f6ae7c" # LiteralNumberFloat
    mo: "noinherit #f6ae7c" # LiteralNumberOct
    o: "noinherit bold #9fe9f1" # Operator
    ow: "noinherit bold #9fe9f1" # OperatorWord
    c: "noinherit italic #223427" # Comment
    cs: "noinherit italic #223427" # CommentSingle
    cm: "noinherit italic #223427" # CommentMultiline
    cx: "noinherit italic #223427" # CommentSpecial
    ch: "noinherit italic #223427" # CommentHashbang
    cp: "noinherit italic #223427" # CommentPreproc
