# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Canopy Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007184"
    secondary: "# 046aa7"
    error: "#860c2c"
    inactive: "#808a7d"
    success: "#337545"
  chromaStyleOverrides:
    bg: "noinherit #1e3323 bg:#f1f9ef"
    "": "noinherit #1e3323"
    kc: "noinherit #65599e" # Keyword.Constant
    kr: "noinherit #65599e" # KeywordReserved
    kd: "noinherit #5b1d26" # KeywordDeclaration
    kn: "noinherit #007184" # KeywordNamespace
    kt: "noinherit #5b1d26" # KeywordType
    n: "noinherit #1e3323" # Name
    nc: "noinherit #905705" # NameClass
    no: "noinherit #905705" # NameConstant
    ne: "noinherit #7b3c12" # NameException
    nf: "noinherit #864c82" # NameFunction
    nl: "noinherit #005b6b" # NameLabel
    nn: "noinherit #7b3c12" # NameNamespace
    py: "noinherit #7b3c12" # NameProperty
    nt: "noinherit #860c2c" # NameTag
    nv: "noinherit #424b3f" # NameVariable
    vc: "noinherit #424b3f" # NameVariableClass
    vg: "noinherit #424b3f" # NameVariableGlobal
    vi: "noinherit #424b3f" # NameVariableInstance
    na: "noinherit #864c82" # NameAttribute
    nb: "noinherit #005b6b" # NameBuiltin
    nx: "noinherit #1e3323" # NameOther
    l: "noinherit #1e3323" # Literal
    s: "noinherit #337545" # LiteralString
    sc: "noinherit #337545" # LiteralStringChar
    s1: "noinherit #337545" # LiteralStringSingle
    s2: "noinherit #337545" # LiteralStringDouble
    sb: "noinherit #337545" # LiteralStringBacktick
    sx: "noinherit #337545" # LiteralStringOther
    si: "noinherit #337545" # LiteralStringInterpol
    sr: "noinherit #007184" # LiteralStringRegex
    sd: "noinherit #cdd7cb" # LiteralStringDoc
    sh: "noinherit #cdd7cb" # LiteralStringHeredoc
    m: "noinherit #7b3c12" # LiteralNumber
    mb: "noinherit #7b3c12" # LiteralNumberBin
    mh: "noinherit #7b3c12" # LiteralNumberHex
    mi: "noinherit #7b3c12" # LiteralNumberInteger
    mf: "noinherit #7b3c12" # LiteralNumberFloat
    mo: "noinherit #7b3c12" # LiteralNumberOct
    o: "noinherit bold #005b6b" # Operator
    ow: "noinherit bold #005b6b" # OperatorWord
    c: "noinherit italic #cdd7cb" # Comment
    cs: "noinherit italic #cdd7cb" # CommentSingle
    cm: "noinherit italic #cdd7cb" # CommentMultiline
    cx: "noinherit italic #cdd7cb" # CommentSpecial
    ch: "noinherit italic #cdd7cb" # CommentHashbang
    cp: "noinherit italic #cdd7cb" # CommentPreproc
