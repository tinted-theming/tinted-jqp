# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Cherenkov Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#6ad0db"
    secondary: "# c4dbed"
    error: "#da6159"
    inactive: "#5f697d"
    success: "#8bd29a"
  chromaStyleOverrides:
    bg: "noinherit #d0dce9 bg:#0a111f"
    "": "noinherit #d0dce9"
    kc: "noinherit #cdaef2" # Keyword.Constant
    kr: "noinherit #cdaef2" # KeywordReserved
    kd: "noinherit #e5867e" # KeywordDeclaration
    kn: "noinherit #6ad0db" # KeywordNamespace
    kt: "noinherit #e5867e" # KeywordType
    n: "noinherit #d0dce9" # Name
    nc: "noinherit #e0b955" # NameClass
    no: "noinherit #e0b955" # NameConstant
    ne: "noinherit #fda769" # NameException
    nf: "noinherit #e7a3e0" # NameFunction
    nl: "noinherit #84eaf6" # NameLabel
    nn: "noinherit #fda769" # NameNamespace
    py: "noinherit #fda769" # NameProperty
    nt: "noinherit #da6159" # NameTag
    nv: "noinherit #aab1bf" # NameVariable
    vc: "noinherit #aab1bf" # NameVariableClass
    vg: "noinherit #aab1bf" # NameVariableGlobal
    vi: "noinherit #aab1bf" # NameVariableInstance
    na: "noinherit #e7a3e0" # NameAttribute
    nb: "noinherit #84eaf6" # NameBuiltin
    nx: "noinherit #d0dce9" # NameOther
    l: "noinherit #d0dce9" # Literal
    s: "noinherit #8bd29a" # LiteralString
    sc: "noinherit #8bd29a" # LiteralStringChar
    s1: "noinherit #8bd29a" # LiteralStringSingle
    s2: "noinherit #8bd29a" # LiteralStringDouble
    sb: "noinherit #8bd29a" # LiteralStringBacktick
    sx: "noinherit #8bd29a" # LiteralStringOther
    si: "noinherit #8bd29a" # LiteralStringInterpol
    sr: "noinherit #6ad0db" # LiteralStringRegex
    sd: "noinherit #20283a" # LiteralStringDoc
    sh: "noinherit #20283a" # LiteralStringHeredoc
    m: "noinherit #fda769" # LiteralNumber
    mb: "noinherit #fda769" # LiteralNumberBin
    mh: "noinherit #fda769" # LiteralNumberHex
    mi: "noinherit #fda769" # LiteralNumberInteger
    mf: "noinherit #fda769" # LiteralNumberFloat
    mo: "noinherit #fda769" # LiteralNumberOct
    o: "noinherit bold #84eaf6" # Operator
    ow: "noinherit bold #84eaf6" # OperatorWord
    c: "noinherit italic #20283a" # Comment
    cs: "noinherit italic #20283a" # CommentSingle
    cm: "noinherit italic #20283a" # CommentMultiline
    cx: "noinherit italic #20283a" # CommentSpecial
    ch: "noinherit italic #20283a" # CommentHashbang
    cp: "noinherit italic #20283a" # CommentPreproc
