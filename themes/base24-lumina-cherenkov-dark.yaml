# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Cherenkov Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#8fe7fd"
    secondary: "# 4ca1ff"
    error: "#db6c64"
    inactive: "#536a8b"
    success: "#9ad8a6"
  chromaStyleOverrides:
    bg: "noinherit #d7e7f5 bg:#021129"
    "": "noinherit #d7e7f5"
    kc: "noinherit #c7aefe" # Keyword.Constant
    kr: "noinherit #c7aefe" # KeywordReserved
    kd: "noinherit #e79088" # KeywordDeclaration
    kn: "noinherit #8fe7fd" # KeywordNamespace
    kt: "noinherit #e79088" # KeywordType
    n: "noinherit #d7e7f5" # Name
    nc: "noinherit #ead293" # NameClass
    no: "noinherit #ead293" # NameConstant
    ne: "noinherit #fba26f" # NameException
    nf: "noinherit #ecafe6" # NameFunction
    nl: "noinherit #bff2ff" # NameLabel
    nn: "noinherit #fba26f" # NameNamespace
    py: "noinherit #fba26f" # NameProperty
    nt: "noinherit #db6c64" # NameTag
    nv: "noinherit #a2b3ca" # NameVariable
    vc: "noinherit #a2b3ca" # NameVariableClass
    vg: "noinherit #a2b3ca" # NameVariableGlobal
    vi: "noinherit #a2b3ca" # NameVariableInstance
    na: "noinherit #ecafe6" # NameAttribute
    nb: "noinherit #bff2ff" # NameBuiltin
    nx: "noinherit #d7e7f5" # NameOther
    l: "noinherit #d7e7f5" # Literal
    s: "noinherit #9ad8a6" # LiteralString
    sc: "noinherit #9ad8a6" # LiteralStringChar
    s1: "noinherit #9ad8a6" # LiteralStringSingle
    s2: "noinherit #9ad8a6" # LiteralStringDouble
    sb: "noinherit #9ad8a6" # LiteralStringBacktick
    sx: "noinherit #9ad8a6" # LiteralStringOther
    si: "noinherit #9ad8a6" # LiteralStringInterpol
    sr: "noinherit #8fe7fd" # LiteralStringRegex
    sd: "noinherit #142946" # LiteralStringDoc
    sh: "noinherit #142946" # LiteralStringHeredoc
    m: "noinherit #fba26f" # LiteralNumber
    mb: "noinherit #fba26f" # LiteralNumberBin
    mh: "noinherit #fba26f" # LiteralNumberHex
    mi: "noinherit #fba26f" # LiteralNumberInteger
    mf: "noinherit #fba26f" # LiteralNumberFloat
    mo: "noinherit #fba26f" # LiteralNumberOct
    o: "noinherit bold #bff2ff" # Operator
    ow: "noinherit bold #bff2ff" # OperatorWord
    c: "noinherit italic #142946" # Comment
    cs: "noinherit italic #142946" # CommentSingle
    cm: "noinherit italic #142946" # CommentMultiline
    cx: "noinherit italic #142946" # CommentSpecial
    ch: "noinherit italic #142946" # CommentHashbang
    cp: "noinherit italic #142946" # CommentPreproc
