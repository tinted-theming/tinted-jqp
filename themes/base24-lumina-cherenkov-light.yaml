    c: "noinherit italic #d1d5df" # Comment
    cs: "noinherit italic #d1d5df" # CommentSingle
    cm: "noinherit italic #d1d5df" # CommentMultiline
    cx: "noinherit italic #d1d5df" # CommentSpecial
    ch: "noinherit italic #d1d5df" # CommentHashbang
    cp: "noinherit italic #d1d5df" # CommentPreproc
