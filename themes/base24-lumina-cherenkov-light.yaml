# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Cherenkov Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#087181"
    secondary: "# 0a4fcc"
    error: "#a32224"
    inactive: "#82868f"
    success: "#227a3e"
  chromaStyleOverrides:
    bg: "noinherit #1f2e53 bg:#f5f8ff"
    "": "noinherit #1f2e53"
    kc: "noinherit #7849c1" # Keyword.Constant
    kr: "noinherit #7849c1" # KeywordReserved
    kd: "noinherit #792825" # KeywordDeclaration
    kn: "noinherit #087181" # KeywordNamespace
    kt: "noinherit #792825" # KeywordType
    n: "noinherit #1f2e53" # Name
    nc: "noinherit #a35f00" # NameClass
    no: "noinherit #a35f00" # NameConstant
    ne: "noinherit #b54a04" # NameException
    nf: "noinherit #90478a" # NameFunction
    nl: "noinherit #005c69" # NameLabel
    nn: "noinherit #b54a04" # NameNamespace
    py: "noinherit #b54a04" # NameProperty
    nt: "noinherit #a32224" # NameTag
    nv: "noinherit #44484f" # NameVariable
    vc: "noinherit #44484f" # NameVariableClass
    vg: "noinherit #44484f" # NameVariableGlobal
    vi: "noinherit #44484f" # NameVariableInstance
    na: "noinherit #90478a" # NameAttribute
    nb: "noinherit #005c69" # NameBuiltin
    nx: "noinherit #1f2e53" # NameOther
    l: "noinherit #1f2e53" # Literal
    s: "noinherit #227a3e" # LiteralString
    sc: "noinherit #227a3e" # LiteralStringChar
    s1: "noinherit #227a3e" # LiteralStringSingle
    s2: "noinherit #227a3e" # LiteralStringDouble
    sb: "noinherit #227a3e" # LiteralStringBacktick
    sx: "noinherit #227a3e" # LiteralStringOther
    si: "noinherit #227a3e" # LiteralStringInterpol
    sr: "noinherit #087181" # LiteralStringRegex
    sd: "noinherit #d1d5df" # LiteralStringDoc
    sh: "noinherit #d1d5df" # LiteralStringHeredoc
    m: "noinherit #b54a04" # LiteralNumber
    mb: "noinherit #b54a04" # LiteralNumberBin
    mh: "noinherit #b54a04" # LiteralNumberHex
    mi: "noinherit #b54a04" # LiteralNumberInteger
    mf: "noinherit #b54a04" # LiteralNumberFloat
    mo: "noinherit #b54a04" # LiteralNumberOct
    o: "noinherit bold #005c69" # Operator
