# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Dusk Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#90cfd7"
    secondary: "# 9bbef2"
    error: "#d0746c"
    inactive: "#6d697d"
    success: "#a0d1a9"
  chromaStyleOverrides:
    bg: "noinherit #e0dcea bg:#1a1825"
    "": "noinherit #e0dcea"
    kc: "noinherit #c1bbf0" # Keyword.Constant
    kr: "noinherit #c1bbf0" # KeywordReserved
    kd: "noinherit #de958d" # KeywordDeclaration
    kn: "noinherit #90cfd7" # KeywordNamespace
    kt: "noinherit #de958d" # KeywordType
    n: "noinherit #e0dcea" # Name
    nc: "noinherit #efcb7b" # NameClass
    no: "noinherit #efcb7b" # NameConstant
    ne: "noinherit #f5b284" # NameException
    nf: "noinherit #e1b0dc" # NameFunction
    nl: "noinherit #a9e9f2" # NameLabel
    nn: "noinherit #f5b284" # NameNamespace
    py: "noinherit #f5b284" # NameProperty
    nt: "noinherit #d0746c" # NameTag
    nv: "noinherit #b1afbc" # NameVariable
    vc: "noinherit #b1afbc" # NameVariableClass
    vg: "noinherit #b1afbc" # NameVariableGlobal
    vi: "noinherit #b1afbc" # NameVariableInstance
    na: "noinherit #e1b0dc" # NameAttribute
    nb: "noinherit #a9e9f2" # NameBuiltin
    nx: "noinherit #e0dcea" # NameOther
    l: "noinherit #e0dcea" # Literal
    s: "noinherit #a0d1a9" # LiteralString
    sc: "noinherit #a0d1a9" # LiteralStringChar
    s1: "noinherit #a0d1a9" # LiteralStringSingle
    s2: "noinherit #a0d1a9" # LiteralStringDouble
    sb: "noinherit #a0d1a9" # LiteralStringBacktick
    sx: "noinherit #a0d1a9" # LiteralStringOther
    si: "noinherit #a0d1a9" # LiteralStringInterpol
    sr: "noinherit #90cfd7" # LiteralStringRegex
    sd: "noinherit #323040" # LiteralStringDoc
    sh: "noinherit #323040" # LiteralStringHeredoc
    m: "noinherit #f5b284" # LiteralNumber
    mb: "noinherit #f5b284" # LiteralNumberBin
    mh: "noinherit #f5b284" # LiteralNumberHex
    mi: "noinherit #f5b284" # LiteralNumberInteger
    mf: "noinherit #f5b284" # LiteralNumberFloat
    mo: "noinherit #f5b284" # LiteralNumberOct
    o: "noinherit bold #a9e9f2" # Operator
    ow: "noinherit bold #a9e9f2" # OperatorWord
    c: "noinherit italic #323040" # Comment
    cs: "noinherit italic #323040" # CommentSingle
    cm: "noinherit italic #323040" # CommentMultiline
    cx: "noinherit italic #323040" # CommentSpecial
    ch: "noinherit italic #323040" # CommentHashbang
    cp: "noinherit italic #323040" # CommentPreproc
