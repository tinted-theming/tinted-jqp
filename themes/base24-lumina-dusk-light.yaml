# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Dusk Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007185"
    secondary: "# 3163ad"
    error: "#872423"
    inactive: "#878491"
    success: "#357545"
  chromaStyleOverrides:
    bg: "noinherit #2e2945 bg:#f6f3fe"
    "": "noinherit #2e2945"
    kc: "noinherit #7b46a4" # Keyword.Constant
    kr: "noinherit #7b46a4" # KeywordReserved
    kd: "noinherit #622320" # KeywordDeclaration
    kn: "noinherit #007185" # KeywordNamespace
    kt: "noinherit #622320" # KeywordType
    n: "noinherit #2e2945" # Name
    nc: "noinherit #9e611b" # NameClass
    no: "noinherit #9e611b" # NameConstant
    ne: "noinherit #8c491d" # NameException
    nf: "noinherit #874d82" # NameFunction
    nl: "noinherit #005b6c" # NameLabel
    nn: "noinherit #8c491d" # NameNamespace
    py: "noinherit #8c491d" # NameProperty
    nt: "noinherit #872423" # NameTag
    nv: "noinherit #494552" # NameVariable
    vc: "noinherit #494552" # NameVariableClass
    vg: "noinherit #494552" # NameVariableGlobal
    vi: "noinherit #494552" # NameVariableInstance
    na: "noinherit #874d82" # NameAttribute
    nb: "noinherit #005b6c" # NameBuiltin
    nx: "noinherit #2e2945" # NameOther
    l: "noinherit #2e2945" # Literal
    s: "noinherit #357545" # LiteralString
    sc: "noinherit #357545" # LiteralStringChar
    s1: "noinherit #357545" # LiteralStringSingle
    s2: "noinherit #357545" # LiteralStringDouble
    sb: "noinherit #357545" # LiteralStringBacktick
    sx: "noinherit #357545" # LiteralStringOther
    si: "noinherit #357545" # LiteralStringInterpol
    sr: "noinherit #007185" # LiteralStringRegex
    sd: "noinherit #d4d0de" # LiteralStringDoc
    sh: "noinherit #d4d0de" # LiteralStringHeredoc
    m: "noinherit #8c491d" # LiteralNumber
    mb: "noinherit #8c491d" # LiteralNumberBin
    mh: "noinherit #8c491d" # LiteralNumberHex
    mi: "noinherit #8c491d" # LiteralNumberInteger
    mf: "noinherit #8c491d" # LiteralNumberFloat
    mo: "noinherit #8c491d" # LiteralNumberOct
    o: "noinherit bold #005b6c" # Operator
    ow: "noinherit bold #005b6c" # OperatorWord
    c: "noinherit italic #d4d0de" # Comment
    cs: "noinherit italic #d4d0de" # CommentSingle
    cm: "noinherit italic #d4d0de" # CommentMultiline
    cx: "noinherit italic #d4d0de" # CommentSpecial
    ch: "noinherit italic #d4d0de" # CommentHashbang
    cp: "noinherit italic #d4d0de" # CommentPreproc
