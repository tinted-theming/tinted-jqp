# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Ember Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#91c7cd"
    secondary: "# 94bedc"
    error: "#cb7870"
    inactive: "#6b6963"
    success: "#a9cc97"
  chromaStyleOverrides:
    bg: "noinherit #e4ddd0 bg:#171511"
    "": "noinherit #e4ddd0"
    kc: "noinherit #bbb5e3" # Keyword.Constant
    kr: "noinherit #bbb5e3" # KeywordReserved
    kd: "noinherit #da9890" # KeywordDeclaration
    kn: "noinherit #91c7cd" # KeywordNamespace
    kt: "noinherit #da9890" # KeywordType
    n: "noinherit #e4ddd0" # Name
    nc: "noinherit #e5cc88" # NameClass
    no: "noinherit #e5cc88" # NameConstant
    ne: "noinherit #e59b7c" # NameException
    nf: "noinherit #d7a2c6" # NameFunction
    nl: "noinherit #aae1e7" # NameLabel
    nn: "noinherit #e59b7c" # NameNamespace
    py: "noinherit #e59b7c" # NameProperty
    nt: "noinherit #cb7870" # NameTag
    nv: "noinherit #b3b1ad" # NameVariable
    vc: "noinherit #b3b1ad" # NameVariableClass
    vg: "noinherit #b3b1ad" # NameVariableGlobal
    vi: "noinherit #b3b1ad" # NameVariableInstance
    na: "noinherit #d7a2c6" # NameAttribute
    nb: "noinherit #aae1e7" # NameBuiltin
    nx: "noinherit #e4ddd0" # NameOther
    l: "noinherit #e4ddd0" # Literal
    s: "noinherit #a9cc97" # LiteralString
    sc: "noinherit #a9cc97" # LiteralStringChar
    s1: "noinherit #a9cc97" # LiteralStringSingle
    s2: "noinherit #a9cc97" # LiteralStringDouble
    sb: "noinherit #a9cc97" # LiteralStringBacktick
    sx: "noinherit #a9cc97" # LiteralStringOther
    si: "noinherit #a9cc97" # LiteralStringInterpol
    sr: "noinherit #91c7cd" # LiteralStringRegex
    sd: "noinherit #2f2d28" # LiteralStringDoc
    sh: "noinherit #2f2d28" # LiteralStringHeredoc
    m: "noinherit #e59b7c" # LiteralNumber
    mb: "noinherit #e59b7c" # LiteralNumberBin
    mh: "noinherit #e59b7c" # LiteralNumberHex
    mi: "noinherit #e59b7c" # LiteralNumberInteger
    mf: "noinherit #e59b7c" # LiteralNumberFloat
    mo: "noinherit #e59b7c" # LiteralNumberOct
    o: "noinherit bold #aae1e7" # Operator
    ow: "noinherit bold #aae1e7" # OperatorWord
    c: "noinherit italic #2f2d28" # Comment
    cs: "noinherit italic #2f2d28" # CommentSingle
    cm: "noinherit italic #2f2d28" # CommentMultiline
    cx: "noinherit italic #2f2d28" # CommentSpecial
    ch: "noinherit italic #2f2d28" # CommentHashbang
    cp: "noinherit italic #2f2d28" # CommentPreproc
