# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Ember Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007285"
    secondary: "# 256b99"
    error: "#811d1d"
    inactive: "#8c8579"
    success: "#437329"
  chromaStyleOverrides:
    bg: "noinherit #372b1e bg:#f9f4ea"
    "": "noinherit #372b1e"
    kc: "noinherit #6559a1" # Keyword.Constant
    kr: "noinherit #6559a1" # KeywordReserved
    kd: "noinherit #5c1d1b" # KeywordDeclaration
    kn: "noinherit #007285" # KeywordNamespace
    kt: "noinherit #5c1d1b" # KeywordType
    n: "noinherit #372b1e" # Name
    nc: "noinherit #a06116" # NameClass
    no: "noinherit #a06116" # NameConstant
    ne: "noinherit #864315" # NameException
    nf: "noinherit #96437b" # NameFunction
    nl: "noinherit #005c6c" # NameLabel
    nn: "noinherit #864315" # NameNamespace
    py: "noinherit #864315" # NameProperty
    nt: "noinherit #811d1d" # NameTag
    nv: "noinherit #4d473c" # NameVariable
    vc: "noinherit #4d473c" # NameVariableClass
    vg: "noinherit #4d473c" # NameVariableGlobal
    vi: "noinherit #4d473c" # NameVariableInstance
    na: "noinherit #96437b" # NameAttribute
    nb: "noinherit #005c6c" # NameBuiltin
    nx: "noinherit #372b1e" # NameOther
    l: "noinherit #372b1e" # Literal
    s: "noinherit #437329" # LiteralString
    sc: "noinherit #437329" # LiteralStringChar
    s1: "noinherit #437329" # LiteralStringSingle
    s2: "noinherit #437329" # LiteralStringDouble
    sb: "noinherit #437329" # LiteralStringBacktick
    sx: "noinherit #437329" # LiteralStringOther
    si: "noinherit #437329" # LiteralStringInterpol
    sr: "noinherit #007285" # LiteralStringRegex
    sd: "noinherit #d8d1c4" # LiteralStringDoc
    sh: "noinherit #d8d1c4" # LiteralStringHeredoc
    m: "noinherit #864315" # LiteralNumber
    mb: "noinherit #864315" # LiteralNumberBin
    mh: "noinherit #864315" # LiteralNumberHex
    mi: "noinherit #864315" # LiteralNumberInteger
    mf: "noinherit #864315" # LiteralNumberFloat
    mo: "noinherit #864315" # LiteralNumberOct
    o: "noinherit bold #005c6c" # Operator
    ow: "noinherit bold #005c6c" # OperatorWord
    c: "noinherit italic #d8d1c4" # Comment
    cs: "noinherit italic #d8d1c4" # CommentSingle
    cm: "noinherit italic #d8d1c4" # CommentMultiline
    cx: "noinherit italic #d8d1c4" # CommentSpecial
    ch: "noinherit italic #d8d1c4" # CommentHashbang
    cp: "noinherit italic #d8d1c4" # CommentPreproc
