# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Ember Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007488"
    secondary: "# 3770b0"
    error: "#972524"
    inactive: "#8a867c"
    success: "#23784f"
  chromaStyleOverrides:
    bg: "noinherit #3d332b bg:#fbf8f0"
    "": "noinherit #3d332b"
    kc: "noinherit #664599" # Keyword.Constant
    kr: "noinherit #664599" # KeywordReserved
    kd: "noinherit #6f2623" # KeywordDeclaration
    kn: "noinherit #007488" # KeywordNamespace
    kt: "noinherit #6f2623" # KeywordType
    n: "noinherit #3d332b" # Name
    nc: "noinherit #68482d" # NameClass
    no: "noinherit #68482d" # NameConstant
    ne: "noinherit #ab4b00" # NameException
    nf: "noinherit #a43a7c" # NameFunction
    nl: "noinherit #005e6f" # NameLabel
    nn: "noinherit #ab4b00" # NameNamespace
    py: "noinherit #ab4b00" # NameProperty
    nt: "noinherit #972524" # NameTag
    nv: "noinherit #4b473e" # NameVariable
    vc: "noinherit #4b473e" # NameVariableClass
    vg: "noinherit #4b473e" # NameVariableGlobal
    vi: "noinherit #4b473e" # NameVariableInstance
    na: "noinherit #a43a7c" # NameAttribute
    nb: "noinherit #005e6f" # NameBuiltin
    nx: "noinherit #3d332b" # NameOther
    l: "noinherit #3d332b" # Literal
    s: "noinherit #23784f" # LiteralString
    sc: "noinherit #23784f" # LiteralStringChar
    s1: "noinherit #23784f" # LiteralStringSingle
    s2: "noinherit #23784f" # LiteralStringDouble
    sb: "noinherit #23784f" # LiteralStringBacktick
    sx: "noinherit #23784f" # LiteralStringOther
    si: "noinherit #23784f" # LiteralStringInterpol
    sr: "noinherit #007488" # LiteralStringRegex
    sd: "noinherit #d9d5ca" # LiteralStringDoc
    sh: "noinherit #d9d5ca" # LiteralStringHeredoc
    m: "noinherit #ab4b00" # LiteralNumber
    mb: "noinherit #ab4b00" # LiteralNumberBin
    mh: "noinherit #ab4b00" # LiteralNumberHex
    mi: "noinherit #ab4b00" # LiteralNumberInteger
    mf: "noinherit #ab4b00" # LiteralNumberFloat
    mo: "noinherit #ab4b00" # LiteralNumberOct
    o: "noinherit bold #005e6f" # Operator
