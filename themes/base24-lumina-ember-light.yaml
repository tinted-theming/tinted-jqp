    cm: "noinherit italic #d9d5ca" # CommentMultiline
    cx: "noinherit italic #d9d5ca" # CommentSpecial
    ch: "noinherit italic #d9d5ca" # CommentHashbang
    cp: "noinherit italic #d9d5ca" # CommentPreproc
