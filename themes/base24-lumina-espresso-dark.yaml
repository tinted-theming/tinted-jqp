# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Espresso Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#90cad1"
    secondary: "# 96bfe9"
    error: "#cd766e"
    inactive: "#74675d"
    success: "#95d3b1"
  chromaStyleOverrides:
    bg: "noinherit #e5dfd6 bg:#1e150e"
    "": "noinherit #e5dfd6"
    kc: "noinherit #c7ade7" # Keyword.Constant
    kr: "noinherit #c7ade7" # KeywordReserved
    kd: "noinherit #db968f" # KeywordDeclaration
    kn: "noinherit #90cad1" # KeywordNamespace
    kt: "noinherit #db968f" # KeywordType
    n: "noinherit #e5dfd6" # Name
    nc: "noinherit #efca86" # NameClass
    no: "noinherit #efca86" # NameConstant
    ne: "noinherit #d9bfa6" # NameException
    nf: "noinherit #dbadd6" # NameFunction
    nl: "noinherit #a9e4ec" # NameLabel
    nn: "noinherit #d9bfa6" # NameNamespace
    py: "noinherit #d9bfa6" # NameProperty
    nt: "noinherit #cd766e" # NameTag
    nv: "noinherit #b8afa9" # NameVariable
    vc: "noinherit #b8afa9" # NameVariableClass
    vg: "noinherit #b8afa9" # NameVariableGlobal
    vi: "noinherit #b8afa9" # NameVariableInstance
    na: "noinherit #dbadd6" # NameAttribute
    nb: "noinherit #a9e4ec" # NameBuiltin
    nx: "noinherit #e5dfd6" # NameOther
    l: "noinherit #e5dfd6" # Literal
    s: "noinherit #95d3b1" # LiteralString
    sc: "noinherit #95d3b1" # LiteralStringChar
    s1: "noinherit #95d3b1" # LiteralStringSingle
    s2: "noinherit #95d3b1" # LiteralStringDouble
    sb: "noinherit #95d3b1" # LiteralStringBacktick
    sx: "noinherit #95d3b1" # LiteralStringOther
    si: "noinherit #95d3b1" # LiteralStringInterpol
    sr: "noinherit #90cad1" # LiteralStringRegex
    sd: "noinherit #382d24" # LiteralStringDoc
    sh: "noinherit #382d24" # LiteralStringHeredoc
    m: "noinherit #d9bfa6" # LiteralNumber
    mb: "noinherit #d9bfa6" # LiteralNumberBin
    mh: "noinherit #d9bfa6" # LiteralNumberHex
    mi: "noinherit #d9bfa6" # LiteralNumberInteger
    mf: "noinherit #d9bfa6" # LiteralNumberFloat
    mo: "noinherit #d9bfa6" # LiteralNumberOct
    o: "noinherit bold #a9e4ec" # Operator
    ow: "noinherit bold #a9e4ec" # OperatorWord
    c: "noinherit italic #382d24" # Comment
    cs: "noinherit italic #382d24" # CommentSingle
    cm: "noinherit italic #382d24" # CommentMultiline
    cx: "noinherit italic #382d24" # CommentSpecial
    ch: "noinherit italic #382d24" # CommentHashbang
    cp: "noinherit italic #382d24" # CommentPreproc
