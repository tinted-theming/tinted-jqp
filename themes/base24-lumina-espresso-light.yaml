# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Espresso Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007083"
    secondary: "# 2868a3"
    error: "#842120"
    inactive: "#928373"
    success: "#15744d"
  chromaStyleOverrides:
    bg: "noinherit #39261b bg:#fcf0e3"
    "": "noinherit #39261b"
    kc: "noinherit #7049a1" # Keyword.Constant
    kr: "noinherit #7049a1" # KeywordReserved
    kd: "noinherit #5f201e" # KeywordDeclaration
    kn: "noinherit #007083" # KeywordNamespace
    kt: "noinherit #5f201e" # KeywordType
    n: "noinherit #39261b" # Name
    nc: "noinherit #6d4e36" # NameClass
    no: "noinherit #6d4e36" # NameConstant
    ne: "noinherit #89461a" # NameException
    nf: "noinherit #864b81" # NameFunction
    nl: "noinherit #005a6a" # NameLabel
    nn: "noinherit #89461a" # NameNamespace
    py: "noinherit #89461a" # NameProperty
    nt: "noinherit #842120" # NameTag
    nv: "noinherit #524536" # NameVariable
    vc: "noinherit #524536" # NameVariableClass
    vg: "noinherit #524536" # NameVariableGlobal
    vi: "noinherit #524536" # NameVariableInstance
    na: "noinherit #864b81" # NameAttribute
    nb: "noinherit #005a6a" # NameBuiltin
    nx: "noinherit #39261b" # NameOther
    l: "noinherit #39261b" # Literal
    s: "noinherit #15744d" # LiteralString
    sc: "noinherit #15744d" # LiteralStringChar
    s1: "noinherit #15744d" # LiteralStringSingle
    s2: "noinherit #15744d" # LiteralStringDouble
    sb: "noinherit #15744d" # LiteralStringBacktick
    sx: "noinherit #15744d" # LiteralStringOther
    si: "noinherit #15744d" # LiteralStringInterpol
    sr: "noinherit #007083" # LiteralStringRegex
    sd: "noinherit #d9cec2" # LiteralStringDoc
    sh: "noinherit #d9cec2" # LiteralStringHeredoc
    m: "noinherit #89461a" # LiteralNumber
    mb: "noinherit #89461a" # LiteralNumberBin
    mh: "noinherit #89461a" # LiteralNumberHex
    mi: "noinherit #89461a" # LiteralNumberInteger
    mf: "noinherit #89461a" # LiteralNumberFloat
    mo: "noinherit #89461a" # LiteralNumberOct
    o: "noinherit bold #005a6a" # Operator
    ow: "noinherit bold #005a6a" # OperatorWord
    c: "noinherit italic #d9cec2" # Comment
    cs: "noinherit italic #d9cec2" # CommentSingle
    cm: "noinherit italic #d9cec2" # CommentMultiline
    cx: "noinherit italic #d9cec2" # CommentSpecial
    ch: "noinherit italic #d9cec2" # CommentHashbang
    cp: "noinherit italic #d9cec2" # CommentPreproc
