# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Harbor Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#91cfd6"
    secondary: "# 91c5ea"
    error: "#d0756c"
    inactive: "#62697a"
    success: "#9bd8b4"
  chromaStyleOverrides:
    bg: "noinherit #dde1eb bg:#0d111d"
    "": "noinherit #dde1eb"
    kc: "noinherit #c1bbef" # Keyword.Constant
    kr: "noinherit #c1bbef" # KeywordReserved
    kd: "noinherit #de968e" # KeywordDeclaration
    kn: "noinherit #91cfd6" # KeywordNamespace
    kt: "noinherit #de968e" # KeywordType
    n: "noinherit #dde1eb" # Name
    nc: "noinherit #eace8c" # NameClass
    no: "noinherit #eace8c" # NameConstant
    ne: "noinherit #f4b285" # NameException
    nf: "noinherit #d3a9dd" # NameFunction
    nl: "noinherit #aae9f0" # NameLabel
    nn: "noinherit #f4b285" # NameNamespace
    py: "noinherit #f4b285" # NameProperty
    nt: "noinherit #d0756c" # NameTag
    nv: "noinherit #acb1bd" # NameVariable
    vc: "noinherit #acb1bd" # NameVariableClass
    vg: "noinherit #acb1bd" # NameVariableGlobal
    vi: "noinherit #acb1bd" # NameVariableInstance
    na: "noinherit #d3a9dd" # NameAttribute
    nb: "noinherit #aae9f0" # NameBuiltin
    nx: "noinherit #dde1eb" # NameOther
    l: "noinherit #dde1eb" # Literal
    s: "noinherit #9bd8b4" # LiteralString
    sc: "noinherit #9bd8b4" # LiteralStringChar
    s1: "noinherit #9bd8b4" # LiteralStringSingle
    s2: "noinherit #9bd8b4" # LiteralStringDouble
    sb: "noinherit #9bd8b4" # LiteralStringBacktick
    sx: "noinherit #9bd8b4" # LiteralStringOther
    si: "noinherit #9bd8b4" # LiteralStringInterpol
    sr: "noinherit #91cfd6" # LiteralStringRegex
    sd: "noinherit #232837" # LiteralStringDoc
    sh: "noinherit #232837" # LiteralStringHeredoc
    m: "noinherit #f4b285" # LiteralNumber
    mb: "noinherit #f4b285" # LiteralNumberBin
    mh: "noinherit #f4b285" # LiteralNumberHex
    mi: "noinherit #f4b285" # LiteralNumberInteger
    mf: "noinherit #f4b285" # LiteralNumberFloat
    mo: "noinherit #f4b285" # LiteralNumberOct
    o: "noinherit bold #aae9f0" # Operator
    ow: "noinherit bold #aae9f0" # OperatorWord
    c: "noinherit italic #232837" # Comment
    cs: "noinherit italic #232837" # CommentSingle
    cm: "noinherit italic #232837" # CommentMultiline
    cx: "noinherit italic #232837" # CommentSpecial
    ch: "noinherit italic #232837" # CommentHashbang
    cp: "noinherit italic #232837" # CommentPreproc
