# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Harbor Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#046871"
    secondary: "# 0468a4"
    error: "#8c1c1d"
    inactive: "#8d857a"
    success: "#19784d"
  chromaStyleOverrides:
    bg: "noinherit #1c2d4f bg:#fbf5ec"
    "": "noinherit #1c2d4f"
    kc: "noinherit #6758a8" # Keyword.Constant
    kr: "noinherit #6758a8" # KeywordReserved
    kd: "noinherit #651f1d" # KeywordDeclaration
    kn: "noinherit #046871" # KeywordNamespace
    kt: "noinherit #651f1d" # KeywordType
    n: "noinherit #1c2d4f" # Name
    nc: "noinherit #a25f06" # NameClass
    no: "noinherit #a25f06" # NameConstant
    ne: "noinherit #9f501d" # NameException
    nf: "noinherit #8b499a" # NameFunction
    nl: "noinherit #00535a" # NameLabel
    nn: "noinherit #9f501d" # NameNamespace
    py: "noinherit #9f501d" # NameProperty
    nt: "noinherit #8c1c1d" # NameTag
    nv: "noinherit #4d473c" # NameVariable
    vc: "noinherit #4d473c" # NameVariableClass
    vg: "noinherit #4d473c" # NameVariableGlobal
    vi: "noinherit #4d473c" # NameVariableInstance
    na: "noinherit #8b499a" # NameAttribute
    nb: "noinherit #00535a" # NameBuiltin
    nx: "noinherit #1c2d4f" # NameOther
    l: "noinherit #1c2d4f" # Literal
    s: "noinherit #19784d" # LiteralString
    sc: "noinherit #19784d" # LiteralStringChar
    s1: "noinherit #19784d" # LiteralStringSingle
    s2: "noinherit #19784d" # LiteralStringDouble
    sb: "noinherit #19784d" # LiteralStringBacktick
    sx: "noinherit #19784d" # LiteralStringOther
    si: "noinherit #19784d" # LiteralStringInterpol
    sr: "noinherit #046871" # LiteralStringRegex
    sd: "noinherit #dad2c6" # LiteralStringDoc
    sh: "noinherit #dad2c6" # LiteralStringHeredoc
    m: "noinherit #9f501d" # LiteralNumber
    mb: "noinherit #9f501d" # LiteralNumberBin
    mh: "noinherit #9f501d" # LiteralNumberHex
    mi: "noinherit #9f501d" # LiteralNumberInteger
    mf: "noinherit #9f501d" # LiteralNumberFloat
    mo: "noinherit #9f501d" # LiteralNumberOct
    o: "noinherit bold #00535a" # Operator
    ow: "noinherit bold #00535a" # OperatorWord
    c: "noinherit italic #dad2c6" # Comment
    cs: "noinherit italic #dad2c6" # CommentSingle
    cm: "noinherit italic #dad2c6" # CommentMultiline
    cx: "noinherit italic #dad2c6" # CommentSpecial
    ch: "noinherit italic #dad2c6" # CommentHashbang
    cp: "noinherit italic #dad2c6" # CommentPreproc
