# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Lagoon Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#5ad3d6"
    secondary: "# 8ec3f9"
    error: "#d3726a"
    inactive: "#547c86"
    success: "#9fd4a9"
  chromaStyleOverrides:
    bg: "noinherit #d7e6e7 bg:#042930"
    "": "noinherit #d7e6e7"
    kc: "noinherit #c8baf6" # Keyword.Constant
    kr: "noinherit #c8baf6" # KeywordReserved
    kd: "noinherit #e0938c" # KeywordDeclaration
    kn: "noinherit #5ad3d6" # KeywordNamespace
    kt: "noinherit #e0938c" # KeywordType
    n: "noinherit #d7e6e7" # Name
    nc: "noinherit #e7cf94" # NameClass
    no: "noinherit #e7cf94" # NameConstant
    ne: "noinherit #f9b283" # NameException
    nf: "noinherit #e5b0df" # NameFunction
    nl: "noinherit #9fe6e8" # NameLabel
    nn: "noinherit #f9b283" # NameNamespace
    py: "noinherit #f9b283" # NameProperty
    nt: "noinherit #d3726a" # NameTag
    nv: "noinherit #9db6bc" # NameVariable
    vc: "noinherit #9db6bc" # NameVariableClass
    vg: "noinherit #9db6bc" # NameVariableGlobal
    vi: "noinherit #9db6bc" # NameVariableInstance
    na: "noinherit #e5b0df" # NameAttribute
    nb: "noinherit #9fe6e8" # NameBuiltin
    nx: "noinherit #d7e6e7" # NameOther
    l: "noinherit #d7e6e7" # Literal
    s: "noinherit #9fd4a9" # LiteralString
    sc: "noinherit #9fd4a9" # LiteralStringChar
    s1: "noinherit #9fd4a9" # LiteralStringSingle
    s2: "noinherit #9fd4a9" # LiteralStringDouble
    sb: "noinherit #9fd4a9" # LiteralStringBacktick
    sx: "noinherit #9fd4a9" # LiteralStringOther
    si: "noinherit #9fd4a9" # LiteralStringInterpol
    sr: "noinherit #5ad3d6" # LiteralStringRegex
    sd: "noinherit #1c434b" # LiteralStringDoc
    sh: "noinherit #1c434b" # LiteralStringHeredoc
    m: "noinherit #f9b283" # LiteralNumber
    mb: "noinherit #f9b283" # LiteralNumberBin
    mh: "noinherit #f9b283" # LiteralNumberHex
    mi: "noinherit #f9b283" # LiteralNumberInteger
    mf: "noinherit #f9b283" # LiteralNumberFloat
    mo: "noinherit #f9b283" # LiteralNumberOct
    o: "noinherit bold #9fe6e8" # Operator
    ow: "noinherit bold #9fe6e8" # OperatorWord
    c: "noinherit italic #1c434b" # Comment
    cs: "noinherit italic #1c434b" # CommentSingle
    cm: "noinherit italic #1c434b" # CommentMultiline
    cx: "noinherit italic #1c434b" # CommentSpecial
    ch: "noinherit italic #1c434b" # CommentHashbang
    cp: "noinherit italic #1c434b" # CommentPreproc
