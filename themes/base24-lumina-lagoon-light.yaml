# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Lagoon Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#345a61"
    secondary: "# 1e69a2"
    error: "#901f1f"
    inactive: "#7b898c"
    success: "#007853"
  chromaStyleOverrides:
    bg: "noinherit #212829 bg:#eef9fb"
    "": "noinherit #212829"
    kc: "noinherit #5f3fa9" # Keyword.Constant
    kr: "noinherit #5f3fa9" # KeywordReserved
    kd: "noinherit #69221e" # KeywordDeclaration
    kn: "noinherit #345a61" # KeywordNamespace
    kt: "noinherit #69221e" # KeywordType
    n: "noinherit #212829" # Name
    nc: "noinherit #a06200" # NameClass
    no: "noinherit #a06200" # NameConstant
    ne: "noinherit #9e501d" # NameException
    nf: "noinherit #8a4885" # NameFunction
    nl: "noinherit #004953" # NameLabel
    nn: "noinherit #9e501d" # NameNamespace
    py: "noinherit #9e501d" # NameProperty
    nt: "noinherit #901f1f" # NameTag
    nv: "noinherit #3e4a4d" # NameVariable
    vc: "noinherit #3e4a4d" # NameVariableClass
    vg: "noinherit #3e4a4d" # NameVariableGlobal
    vi: "noinherit #3e4a4d" # NameVariableInstance
    na: "noinherit #8a4885" # NameAttribute
    nb: "noinherit #004953" # NameBuiltin
    nx: "noinherit #212829" # NameOther
    l: "noinherit #212829" # Literal
    s: "noinherit #007853" # LiteralString
    sc: "noinherit #007853" # LiteralStringChar
    s1: "noinherit #007853" # LiteralStringSingle
    s2: "noinherit #007853" # LiteralStringDouble
    sb: "noinherit #007853" # LiteralStringBacktick
    sx: "noinherit #007853" # LiteralStringOther
    si: "noinherit #007853" # LiteralStringInterpol
    sr: "noinherit #345a61" # LiteralStringRegex
    sd: "noinherit #c8d7da" # LiteralStringDoc
    sh: "noinherit #c8d7da" # LiteralStringHeredoc
    m: "noinherit #9e501d" # LiteralNumber
