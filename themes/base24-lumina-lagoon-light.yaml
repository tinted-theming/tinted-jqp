# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Lagoon Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#006e71"
    secondary: "# 185ca9"
    error: "#8f2121"
    inactive: "#758b8b"
    success: "#2e6147"
  chromaStyleOverrides:
    bg: "noinherit #0b323b bg:#e9fafa"
    "": "noinherit #0b323b"
    kc: "noinherit #7153b5" # Keyword.Constant
    kr: "noinherit #7153b5" # KeywordReserved
    kd: "noinherit #682220" # KeywordDeclaration
    kn: "noinherit #006e71" # KeywordNamespace
    kt: "noinherit #682220" # KeywordType
    n: "noinherit #0b323b" # Name
    nc: "noinherit #a1600d" # NameClass
    no: "noinherit #a1600d" # NameConstant
    ne: "noinherit #924918" # NameException
    nf: "noinherit #894984" # NameFunction
    nl: "noinherit #00585b" # NameLabel
    nn: "noinherit #924918" # NameNamespace
    py: "noinherit #924918" # NameProperty
    nt: "noinherit #8f2121" # NameTag
    nv: "noinherit #384c4c" # NameVariable
    vc: "noinherit #384c4c" # NameVariableClass
    vg: "noinherit #384c4c" # NameVariableGlobal
    vi: "noinherit #384c4c" # NameVariableInstance
    na: "noinherit #894984" # NameAttribute
    nb: "noinherit #00585b" # NameBuiltin
    nx: "noinherit #0b323b" # NameOther
    l: "noinherit #0b323b" # Literal
    s: "noinherit #2e6147" # LiteralString
    sc: "noinherit #2e6147" # LiteralStringChar
    s1: "noinherit #2e6147" # LiteralStringSingle
    s2: "noinherit #2e6147" # LiteralStringDouble
    sb: "noinherit #2e6147" # LiteralStringBacktick
    sx: "noinherit #2e6147" # LiteralStringOther
    si: "noinherit #2e6147" # LiteralStringInterpol
    sr: "noinherit #006e71" # LiteralStringRegex
    sd: "noinherit #c5d8d8" # LiteralStringDoc
    sh: "noinherit #c5d8d8" # LiteralStringHeredoc
    m: "noinherit #924918" # LiteralNumber
    mb: "noinherit #924918" # LiteralNumberBin
    mh: "noinherit #924918" # LiteralNumberHex
    mi: "noinherit #924918" # LiteralNumberInteger
    mf: "noinherit #924918" # LiteralNumberFloat
    mo: "noinherit #924918" # LiteralNumberOct
    o: "noinherit bold #00585b" # Operator
    ow: "noinherit bold #00585b" # OperatorWord
    c: "noinherit italic #c5d8d8" # Comment
    cs: "noinherit italic #c5d8d8" # CommentSingle
    cm: "noinherit italic #c5d8d8" # CommentMultiline
    cx: "noinherit italic #c5d8d8" # CommentSpecial
    ch: "noinherit italic #c5d8d8" # CommentHashbang
    cp: "noinherit italic #c5d8d8" # CommentPreproc
