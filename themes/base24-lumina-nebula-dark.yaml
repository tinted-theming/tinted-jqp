# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Nebula Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#88d2da"
    secondary: "# c6d6e8"
    error: "#d57068"
    inactive: "#666b7e"
    success: "#8fdcba"
  chromaStyleOverrides:
    bg: "noinherit #dde1ec bg:#161826"
    "": "noinherit #dde1ec"
    kc: "noinherit #b0a4f8" # Keyword.Constant
    kr: "noinherit #b0a4f8" # KeywordReserved
    kd: "noinherit #e2928a" # KeywordDeclaration
    kn: "noinherit #88d2da" # KeywordNamespace
    kt: "noinherit #e2928a" # KeywordType
    n: "noinherit #dde1ec" # Name
    nc: "noinherit #f3c085" # NameClass
    no: "noinherit #f3c085" # NameConstant
    ne: "noinherit #fab17e" # NameException
    nf: "noinherit #e5aedf" # NameFunction
    nl: "noinherit #a1ecf5" # NameLabel
    nn: "noinherit #fab17e" # NameNamespace
    py: "noinherit #fab17e" # NameProperty
    nt: "noinherit #d57068" # NameTag
    nv: "noinherit #aeb0be" # NameVariable
    vc: "noinherit #aeb0be" # NameVariableClass
    vg: "noinherit #aeb0be" # NameVariableGlobal
    vi: "noinherit #aeb0be" # NameVariableInstance
    na: "noinherit #e5aedf" # NameAttribute
    nb: "noinherit #a1ecf5" # NameBuiltin
    nx: "noinherit #dde1ec" # NameOther
    l: "noinherit #dde1ec" # Literal
    s: "noinherit #8fdcba" # LiteralString
    sc: "noinherit #8fdcba" # LiteralStringChar
    s1: "noinherit #8fdcba" # LiteralStringSingle
    s2: "noinherit #8fdcba" # LiteralStringDouble
    sb: "noinherit #8fdcba" # LiteralStringBacktick
    sx: "noinherit #8fdcba" # LiteralStringOther
    si: "noinherit #8fdcba" # LiteralStringInterpol
    sr: "noinherit #88d2da" # LiteralStringRegex
    sd: "noinherit #2d3041" # LiteralStringDoc
    sh: "noinherit #2d3041" # LiteralStringHeredoc
    m: "noinherit #fab17e" # LiteralNumber
    mb: "noinherit #fab17e" # LiteralNumberBin
    mh: "noinherit #fab17e" # LiteralNumberHex
    mi: "noinherit #fab17e" # LiteralNumberInteger
    mf: "noinherit #fab17e" # LiteralNumberFloat
    mo: "noinherit #fab17e" # LiteralNumberOct
    o: "noinherit bold #a1ecf5" # Operator
    ow: "noinherit bold #a1ecf5" # OperatorWord
    c: "noinherit italic #2d3041" # Comment
    cs: "noinherit italic #2d3041" # CommentSingle
    cm: "noinherit italic #2d3041" # CommentMultiline
    cx: "noinherit italic #2d3041" # CommentSpecial
    ch: "noinherit italic #2d3041" # CommentHashbang
    cp: "noinherit italic #2d3041" # CommentPreproc
