# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Nebula Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#016e90"
    secondary: "# 3f5777"
    error: "#932222"
    inactive: "#888391"
    success: "#007650"
  chromaStyleOverrides:
    bg: "noinherit #2d2c46 bg:#f8f4ff"
    "": "noinherit #2d2c46"
    kc: "noinherit #5d40b1" # Keyword.Constant
    kr: "noinherit #5d40b1" # KeywordReserved
    kd: "noinherit #6c2421" # KeywordDeclaration
    kn: "noinherit #016e90" # KeywordNamespace
    kt: "noinherit #6c2421" # KeywordType
    n: "noinherit #2d2c46" # Name
    nc: "noinherit #955b01" # NameClass
    no: "noinherit #955b01" # NameConstant
    ne: "noinherit #934916" # NameException
    nf: "noinherit #894884" # NameFunction
    nl: "noinherit #005975" # NameLabel
    nn: "noinherit #934916" # NameNamespace
    py: "noinherit #934916" # NameProperty
    nt: "noinherit #932222" # NameTag
    nv: "noinherit #4a4551" # NameVariable
    vc: "noinherit #4a4551" # NameVariableClass
    vg: "noinherit #4a4551" # NameVariableGlobal
    vi: "noinherit #4a4551" # NameVariableInstance
    na: "noinherit #894884" # NameAttribute
    nb: "noinherit #005975" # NameBuiltin
    nx: "noinherit #2d2c46" # NameOther
    l: "noinherit #2d2c46" # Literal
    s: "noinherit #007650" # LiteralString
    sc: "noinherit #007650" # LiteralStringChar
    s1: "noinherit #007650" # LiteralStringSingle
    s2: "noinherit #007650" # LiteralStringDouble
    sb: "noinherit #007650" # LiteralStringBacktick
    sx: "noinherit #007650" # LiteralStringOther
    si: "noinherit #007650" # LiteralStringInterpol
    sr: "noinherit #016e90" # LiteralStringRegex
    sd: "noinherit #d6d1df" # LiteralStringDoc
    sh: "noinherit #d6d1df" # LiteralStringHeredoc
    m: "noinherit #934916" # LiteralNumber
    mb: "noinherit #934916" # LiteralNumberBin
    mh: "noinherit #934916" # LiteralNumberHex
    mi: "noinherit #934916" # LiteralNumberInteger
    mf: "noinherit #934916" # LiteralNumberFloat
    mo: "noinherit #934916" # LiteralNumberOct
    o: "noinherit bold #005975" # Operator
    ow: "noinherit bold #005975" # OperatorWord
    c: "noinherit italic #d6d1df" # Comment
    cs: "noinherit italic #d6d1df" # CommentSingle
    cm: "noinherit italic #d6d1df" # CommentMultiline
    cx: "noinherit italic #d6d1df" # CommentSpecial
    ch: "noinherit italic #d6d1df" # CommentHashbang
    cp: "noinherit italic #d6d1df" # CommentPreproc
