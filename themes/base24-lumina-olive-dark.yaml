# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Olive Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#8bcfd7"
    secondary: "# a2c4f0"
    error: "#d3726a"
    inactive: "#6a6e58"
    success: "#b5d5c6"
  chromaStyleOverrides:
    bg: "noinherit #e1dfce bg:#1a1b0c"
    "": "noinherit #e1dfce"
    kc: "noinherit #c0baf2" # Keyword.Constant
    kr: "noinherit #c0baf2" # KeywordReserved
    kd: "noinherit #e0938c" # KeywordDeclaration
    kn: "noinherit #8bcfd7" # KeywordNamespace
    kt: "noinherit #e0938c" # KeywordType
    n: "noinherit #e1dfce" # Name
    nc: "noinherit #ebc27c" # NameClass
    no: "noinherit #ebc27c" # NameConstant
    ne: "noinherit #ffc39b" # NameException
    nf: "noinherit #d5a2d0" # NameFunction
    nl: "noinherit #a3e9f2" # NameLabel
    nn: "noinherit #ffc39b" # NameNamespace
    py: "noinherit #ffc39b" # NameProperty
    nt: "noinherit #d3726a" # NameTag
    nv: "noinherit #b1b2a5" # NameVariable
    vc: "noinherit #b1b2a5" # NameVariableClass
    vg: "noinherit #b1b2a5" # NameVariableGlobal
    vi: "noinherit #b1b2a5" # NameVariableInstance
    na: "noinherit #d5a2d0" # NameAttribute
    nb: "noinherit #a3e9f2" # NameBuiltin
    nx: "noinherit #e1dfce" # NameOther
    l: "noinherit #e1dfce" # Literal
    s: "noinherit #b5d5c6" # LiteralString
    sc: "noinherit #b5d5c6" # LiteralStringChar
    s1: "noinherit #b5d5c6" # LiteralStringSingle
    s2: "noinherit #b5d5c6" # LiteralStringDouble
    sb: "noinherit #b5d5c6" # LiteralStringBacktick
    sx: "noinherit #b5d5c6" # LiteralStringOther
    si: "noinherit #b5d5c6" # LiteralStringInterpol
    sr: "noinherit #8bcfd7" # LiteralStringRegex
    sd: "noinherit #323422" # LiteralStringDoc
    sh: "noinherit #323422" # LiteralStringHeredoc
    m: "noinherit #ffc39b" # LiteralNumber
    mb: "noinherit #ffc39b" # LiteralNumberBin
    mh: "noinherit #ffc39b" # LiteralNumberHex
    mi: "noinherit #ffc39b" # LiteralNumberInteger
    mf: "noinherit #ffc39b" # LiteralNumberFloat
    mo: "noinherit #ffc39b" # LiteralNumberOct
    o: "noinherit bold #a3e9f2" # Operator
    ow: "noinherit bold #a3e9f2" # OperatorWord
    c: "noinherit italic #323422" # Comment
    cs: "noinherit italic #323422" # CommentSingle
    cm: "noinherit italic #323422" # CommentMultiline
    cx: "noinherit italic #323422" # CommentSpecial
    ch: "noinherit italic #323422" # CommentHashbang
    cp: "noinherit italic #323422" # CommentPreproc
