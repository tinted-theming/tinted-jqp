# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Olive Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#006f83"
    secondary: "# 3264a3"
    error: "#8a1f1f"
    inactive: "#898772"
    success: "#30624e"
  chromaStyleOverrides:
    bg: "noinherit #302e16 bg:#f7f6e5"
    "": "noinherit #302e16"
    kc: "noinherit #6355a0" # Keyword.Constant
    kr: "noinherit #6355a0" # KeywordReserved
    kd: "noinherit #64201e" # KeywordDeclaration
    kn: "noinherit #006f83" # KeywordNamespace
    kt: "noinherit #64201e" # KeywordType
    n: "noinherit #302e16" # Name
    nc: "noinherit #a16010" # NameClass
    no: "noinherit #a16010" # NameConstant
    ne: "noinherit #a24113" # NameException
    nf: "noinherit #8e4c89" # NameFunction
    nl: "noinherit #00596a" # NameLabel
    nn: "noinherit #a24113" # NameNamespace
    py: "noinherit #a24113" # NameProperty
    nt: "noinherit #8a1f1f" # NameTag
    nv: "noinherit #4a4935" # NameVariable
    vc: "noinherit #4a4935" # NameVariableClass
    vg: "noinherit #4a4935" # NameVariableGlobal
    vi: "noinherit #4a4935" # NameVariableInstance
    na: "noinherit #8e4c89" # NameAttribute
    nb: "noinherit #00596a" # NameBuiltin
    nx: "noinherit #302e16" # NameOther
    l: "noinherit #302e16" # Literal
    s: "noinherit #30624e" # LiteralString
    sc: "noinherit #30624e" # LiteralStringChar
    s1: "noinherit #30624e" # LiteralStringSingle
    s2: "noinherit #30624e" # LiteralStringDouble
    sb: "noinherit #30624e" # LiteralStringBacktick
    sx: "noinherit #30624e" # LiteralStringOther
    si: "noinherit #30624e" # LiteralStringInterpol
    sr: "noinherit #006f83" # LiteralStringRegex
    sd: "noinherit #d4d3c5" # LiteralStringDoc
    sh: "noinherit #d4d3c5" # LiteralStringHeredoc
    m: "noinherit #a24113" # LiteralNumber
    mb: "noinherit #a24113" # LiteralNumberBin
    mh: "noinherit #a24113" # LiteralNumberHex
    mi: "noinherit #a24113" # LiteralNumberInteger
    mf: "noinherit #a24113" # LiteralNumberFloat
    mo: "noinherit #a24113" # LiteralNumberOct
    o: "noinherit bold #00596a" # Operator
