    kc: "noinherit #6556a3" # Keyword.Constant
    kr: "noinherit #6556a3" # KeywordReserved
    kd: "noinherit #732926" # KeywordDeclaration
    kn: "noinherit #087380" # KeywordNamespace
    kt: "noinherit #732926" # KeywordType
    n: "noinherit #42222f" # Name
    nc: "noinherit #a1600a" # NameClass
    no: "noinherit #a1600a" # NameConstant
    ne: "noinherit #9e511f" # NameException
    nf: "noinherit #82469d" # NameFunction
    nl: "noinherit #005d68" # NameLabel
    nn: "noinherit #9e511f" # NameNamespace
    py: "noinherit #9e511f" # NameProperty
    nt: "noinherit #9b2827" # NameTag
    nv: "noinherit #514446" # NameVariable
    vc: "noinherit #514446" # NameVariableClass
    vg: "noinherit #514446" # NameVariableGlobal
    vi: "noinherit #514446" # NameVariableInstance
    na: "noinherit #82469d" # NameAttribute
    nb: "noinherit #005d68" # NameBuiltin
    nx: "noinherit #42222f" # NameOther
    l: "noinherit #42222f" # Literal
    s: "noinherit #237742" # LiteralString
    sc: "noinherit #237742" # LiteralStringChar
    s1: "noinherit #237742" # LiteralStringSingle
    s2: "noinherit #237742" # LiteralStringDouble
