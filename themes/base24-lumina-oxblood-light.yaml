    sx: "noinherit #237742" # LiteralStringOther
    si: "noinherit #237742" # LiteralStringInterpol
    sr: "noinherit #087380" # LiteralStringRegex
    sd: "noinherit #deced1" # LiteralStringDoc
    sh: "noinherit #deced1" # LiteralStringHeredoc
    m: "noinherit #9e511f" # LiteralNumber
