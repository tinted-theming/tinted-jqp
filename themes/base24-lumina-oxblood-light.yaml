    mh: "noinherit #9e511f" # LiteralNumberHex
    mi: "noinherit #9e511f" # LiteralNumberInteger
    mf: "noinherit #9e511f" # LiteralNumberFloat
    mo: "noinherit #9e511f" # LiteralNumberOct
    o: "noinherit bold #005d68" # Operator
