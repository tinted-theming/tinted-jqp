# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Parchment Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#85cbd3"
    secondary: "# 97bdf4"
    error: "#d47169"
    inactive: "#7f7162"
    success: "#92d3b9"
  chromaStyleOverrides:
    bg: "noinherit #efe5d0 bg:#2a2116"
    "": "noinherit #efe5d0"
    kc: "noinherit #bcb5ee" # Keyword.Constant
    kr: "noinherit #bcb5ee" # KeywordReserved
    kd: "noinherit #e1938b" # KeywordDeclaration
    kn: "noinherit #85cbd3" # KeywordNamespace
    kt: "noinherit #e1938b" # KeywordType
    n: "noinherit #efe5d0" # Name
    nc: "noinherit #e0ba6a" # NameClass
    no: "noinherit #e0ba6a" # NameConstant
    ne: "noinherit #ffbd90" # NameException
    nf: "noinherit #d4a3dc" # NameFunction
    nl: "noinherit #9ee5ee" # NameLabel
    nn: "noinherit #ffbd90" # NameNamespace
    py: "noinherit #ffbd90" # NameProperty
    nt: "noinherit #d47169" # NameTag
    nv: "noinherit #b8b0a6" # NameVariable
    vc: "noinherit #b8b0a6" # NameVariableClass
    vg: "noinherit #b8b0a6" # NameVariableGlobal
    vi: "noinherit #b8b0a6" # NameVariableInstance
    na: "noinherit #d4a3dc" # NameAttribute
    nb: "noinherit #9ee5ee" # NameBuiltin
    nx: "noinherit #efe5d0" # NameOther
    l: "noinherit #efe5d0" # Literal
    s: "noinherit #92d3b9" # LiteralString
    sc: "noinherit #92d3b9" # LiteralStringChar
    s1: "noinherit #92d3b9" # LiteralStringSingle
    s2: "noinherit #92d3b9" # LiteralStringDouble
    sb: "noinherit #92d3b9" # LiteralStringBacktick
    sx: "noinherit #92d3b9" # LiteralStringOther
    si: "noinherit #92d3b9" # LiteralStringInterpol
    sr: "noinherit #85cbd3" # LiteralStringRegex
    sd: "noinherit #443a2d" # LiteralStringDoc
    sh: "noinherit #443a2d" # LiteralStringHeredoc
    m: "noinherit #ffbd90" # LiteralNumber
    mb: "noinherit #ffbd90" # LiteralNumberBin
    mh: "noinherit #ffbd90" # LiteralNumberHex
    mi: "noinherit #ffbd90" # LiteralNumberInteger
    mf: "noinherit #ffbd90" # LiteralNumberFloat
    mo: "noinherit #ffbd90" # LiteralNumberOct
    o: "noinherit bold #9ee5ee" # Operator
    ow: "noinherit bold #9ee5ee" # OperatorWord
    c: "noinherit italic #443a2d" # Comment
    cs: "noinherit italic #443a2d" # CommentSingle
    cm: "noinherit italic #443a2d" # CommentMultiline
    cx: "noinherit italic #443a2d" # CommentSpecial
    ch: "noinherit italic #443a2d" # CommentHashbang
    cp: "noinherit italic #443a2d" # CommentPreproc
