# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Parchment Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#006e81"
    secondary: "# 2e5fb0"
    error: "#912918"
    inactive: "#908369"
    success: "#2d7341"
  chromaStyleOverrides:
    bg: "noinherit #352516 bg:#f9efda"
    "": "noinherit #352516"
    kc: "noinherit #62559d" # Keyword.Constant
    kr: "noinherit #62559d" # KeywordReserved
    kd: "noinherit #6b281c" # KeywordDeclaration
    kn: "noinherit #006e81" # KeywordNamespace
    kt: "noinherit #6b281c" # KeywordType
    n: "noinherit #352516" # Name
    nc: "noinherit #654935" # NameClass
    no: "noinherit #654935" # NameConstant
    ne: "noinherit #654935" # NameException
    nf: "noinherit #87418e" # NameFunction
    nl: "noinherit #005868" # NameLabel
    nn: "noinherit #654935" # NameNamespace
    py: "noinherit #654935" # NameProperty
    nt: "noinherit #912918" # NameTag
    nv: "noinherit #52462d" # NameVariable
    vc: "noinherit #52462d" # NameVariableClass
    vg: "noinherit #52462d" # NameVariableGlobal
    vi: "noinherit #52462d" # NameVariableInstance
    na: "noinherit #87418e" # NameAttribute
    nb: "noinherit #005868" # NameBuiltin
    nx: "noinherit #352516" # NameOther
    l: "noinherit #352516" # Literal
    s: "noinherit #2d7341" # LiteralString
    sc: "noinherit #2d7341" # LiteralStringChar
    s1: "noinherit #2d7341" # LiteralStringSingle
    s2: "noinherit #2d7341" # LiteralStringDouble
    sb: "noinherit #2d7341" # LiteralStringBacktick
    sx: "noinherit #2d7341" # LiteralStringOther
    si: "noinherit #2d7341" # LiteralStringInterpol
    sr: "noinherit #006e81" # LiteralStringRegex
    sd: "noinherit #d3cdbf" # LiteralStringDoc
    sh: "noinherit #d3cdbf" # LiteralStringHeredoc
    m: "noinherit #654935" # LiteralNumber
    mb: "noinherit #654935" # LiteralNumberBin
    mh: "noinherit #654935" # LiteralNumberHex
    mi: "noinherit #654935" # LiteralNumberInteger
    mf: "noinherit #654935" # LiteralNumberFloat
    mo: "noinherit #654935" # LiteralNumberOct
    o: "noinherit bold #005868" # Operator
    ow: "noinherit bold #005868" # OperatorWord
    c: "noinherit italic #d3cdbf" # Comment
    cs: "noinherit italic #d3cdbf" # CommentSingle
    cm: "noinherit italic #d3cdbf" # CommentMultiline
    cx: "noinherit italic #d3cdbf" # CommentSpecial
    ch: "noinherit italic #d3cdbf" # CommentHashbang
    cp: "noinherit italic #d3cdbf" # CommentPreproc
