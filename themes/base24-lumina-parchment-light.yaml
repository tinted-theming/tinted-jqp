    cm: "noinherit italic #cdc7b9" # CommentMultiline
    cx: "noinherit italic #cdc7b9" # CommentSpecial
    ch: "noinherit italic #cdc7b9" # CommentHashbang
    cp: "noinherit italic #cdc7b9" # CommentPreproc
