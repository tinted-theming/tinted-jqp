# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Quartz Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#a8d5db"
    secondary: "# b6ceed"
    error: "#c57c74"
    inactive: "#676a6d"
    success: "#9dd7b7"
  chromaStyleOverrides:
    bg: "noinherit #ccd0d3 bg:#161719"
    "": "noinherit #ccd0d3"
    kc: "noinherit #cbb4ef" # Keyword.Constant
    kr: "noinherit #cbb4ef" # KeywordReserved
    kd: "noinherit #d59a93" # KeywordDeclaration
    kn: "noinherit #a8d5db" # KeywordNamespace
    kt: "noinherit #d59a93" # KeywordType
    n: "noinherit #ccd0d3" # Name
    nc: "noinherit #dfcfb0" # NameClass
    no: "noinherit #dfcfb0" # NameConstant
    ne: "noinherit #f6be9a" # NameException
    nf: "noinherit #e4bddf" # NameFunction
    nl: "noinherit #c1eff6" # NameLabel
    nn: "noinherit #f6be9a" # NameNamespace
    py: "noinherit #f6be9a" # NameProperty
    nt: "noinherit #c57c74" # NameTag
    nv: "noinherit #b0b1b3" # NameVariable
    vc: "noinherit #b0b1b3" # NameVariableClass
    vg: "noinherit #b0b1b3" # NameVariableGlobal
    vi: "noinherit #b0b1b3" # NameVariableInstance
    na: "noinherit #e4bddf" # NameAttribute
    nb: "noinherit #c1eff6" # NameBuiltin
    nx: "noinherit #ccd0d3" # NameOther
    l: "noinherit #ccd0d3" # Literal
    s: "noinherit #9dd7b7" # LiteralString
    sc: "noinherit #9dd7b7" # LiteralStringChar
    s1: "noinherit #9dd7b7" # LiteralStringSingle
    s2: "noinherit #9dd7b7" # LiteralStringDouble
    sb: "noinherit #9dd7b7" # LiteralStringBacktick
    sx: "noinherit #9dd7b7" # LiteralStringOther
    si: "noinherit #9dd7b7" # LiteralStringInterpol
    sr: "noinherit #a8d5db" # LiteralStringRegex
    sd: "noinherit #2e2f31" # LiteralStringDoc
    sh: "noinherit #2e2f31" # LiteralStringHeredoc
    m: "noinherit #f6be9a" # LiteralNumber
    mb: "noinherit #f6be9a" # LiteralNumberBin
    mh: "noinherit #f6be9a" # LiteralNumberHex
    mi: "noinherit #f6be9a" # LiteralNumberInteger
    mf: "noinherit #f6be9a" # LiteralNumberFloat
    mo: "noinherit #f6be9a" # LiteralNumberOct
    o: "noinherit bold #c1eff6" # Operator
    ow: "noinherit bold #c1eff6" # OperatorWord
    c: "noinherit italic #2e2f31" # Comment
    cs: "noinherit italic #2e2f31" # CommentSingle
    cm: "noinherit italic #2e2f31" # CommentMultiline
    cx: "noinherit italic #2e2f31" # CommentSpecial
    ch: "noinherit italic #2e2f31" # CommentHashbang
    cp: "noinherit italic #2e2f31" # CommentPreproc
