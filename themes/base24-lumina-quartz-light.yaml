# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Quartz Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#007092"
    secondary: "# 446894"
    error: "#7d2b28"
    inactive: "#84868a"
    success: "#217550"
  chromaStyleOverrides:
    bg: "noinherit #30353b bg:#f5f7fa"
    "": "noinherit #30353b"
    kc: "noinherit #7653a5" # Keyword.Constant
    kr: "noinherit #7653a5" # KeywordReserved
    kd: "noinherit #5a2522" # KeywordDeclaration
    kn: "noinherit #007092" # KeywordNamespace
    kt: "noinherit #5a2522" # KeywordType
    n: "noinherit #30353b" # Name
    nc: "noinherit #9a642c" # NameClass
    no: "noinherit #9a642c" # NameConstant
    ne: "noinherit #874c2a" # NameException
    nf: "noinherit #82527e" # NameFunction
    nl: "noinherit #115a74" # NameLabel
    nn: "noinherit #874c2a" # NameNamespace
    py: "noinherit #874c2a" # NameProperty
    nt: "noinherit #7d2b28" # NameTag
    nv: "noinherit #46484b" # NameVariable
    vc: "noinherit #46484b" # NameVariableClass
    vg: "noinherit #46484b" # NameVariableGlobal
    vi: "noinherit #46484b" # NameVariableInstance
    na: "noinherit #82527e" # NameAttribute
    nb: "noinherit #115a74" # NameBuiltin
    nx: "noinherit #30353b" # NameOther
    l: "noinherit #30353b" # Literal
    s: "noinherit #217550" # LiteralString
    sc: "noinherit #217550" # LiteralStringChar
    s1: "noinherit #217550" # LiteralStringSingle
    s2: "noinherit #217550" # LiteralStringDouble
    sb: "noinherit #217550" # LiteralStringBacktick
    sx: "noinherit #217550" # LiteralStringOther
    si: "noinherit #217550" # LiteralStringInterpol
    sr: "noinherit #007092" # LiteralStringRegex
    sd: "noinherit #d2d4d9" # LiteralStringDoc
    sh: "noinherit #d2d4d9" # LiteralStringHeredoc
    m: "noinherit #874c2a" # LiteralNumber
    mb: "noinherit #874c2a" # LiteralNumberBin
    mh: "noinherit #874c2a" # LiteralNumberHex
    mi: "noinherit #874c2a" # LiteralNumberInteger
    mf: "noinherit #874c2a" # LiteralNumberFloat
    mo: "noinherit #874c2a" # LiteralNumberOct
    o: "noinherit bold #115a74" # Operator
    ow: "noinherit bold #115a74" # OperatorWord
    c: "noinherit italic #d2d4d9" # Comment
    cs: "noinherit italic #d2d4d9" # CommentSingle
    cm: "noinherit italic #d2d4d9" # CommentMultiline
    cx: "noinherit italic #d2d4d9" # CommentSpecial
    ch: "noinherit italic #d2d4d9" # CommentHashbang
    cp: "noinherit italic #d2d4d9" # CommentPreproc
