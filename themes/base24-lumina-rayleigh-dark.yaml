# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Rayleigh Dark
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#afdee6"
    secondary: "# 6fc3ff"
    error: "#d96d65"
    inactive: "#567089"
    success: "#96d2a2"
  chromaStyleOverrides:
    bg: "noinherit #d4dfeb bg:#091d30"
    "": "noinherit #d4dfeb"
    kc: "noinherit #bf9ef1" # Keyword.Constant
    kr: "noinherit #bf9ef1" # KeywordReserved
    kd: "noinherit #e59088" # KeywordDeclaration
    kn: "noinherit #afdee6" # KeywordNamespace
    kt: "noinherit #e59088" # KeywordType
    n: "noinherit #d4dfeb" # Name
    nc: "noinherit #f1cc79" # NameClass
    no: "noinherit #f1cc79" # NameConstant
    ne: "noinherit #faac77" # NameException
    nf: "noinherit #eea3c9" # NameFunction
    nl: "noinherit #b6f4ff" # NameLabel
    nn: "noinherit #faac77" # NameNamespace
    py: "noinherit #faac77" # NameProperty
    nt: "noinherit #d96d65" # NameTag
    nv: "noinherit #a2b3c5" # NameVariable
    vc: "noinherit #a2b3c5" # NameVariableClass
    vg: "noinherit #a2b3c5" # NameVariableGlobal
    vi: "noinherit #a2b3c5" # NameVariableInstance
    na: "noinherit #eea3c9" # NameAttribute
    nb: "noinherit #b6f4ff" # NameBuiltin
    nx: "noinherit #d4dfeb" # NameOther
    l: "noinherit #d4dfeb" # Literal
    s: "noinherit #96d2a2" # LiteralString
    sc: "noinherit #96d2a2" # LiteralStringChar
    s1: "noinherit #96d2a2" # LiteralStringSingle
    s2: "noinherit #96d2a2" # LiteralStringDouble
    sb: "noinherit #96d2a2" # LiteralStringBacktick
    sx: "noinherit #96d2a2" # LiteralStringOther
    si: "noinherit #96d2a2" # LiteralStringInterpol
    sr: "noinherit #afdee6" # LiteralStringRegex
    sd: "noinherit #1f364d" # LiteralStringDoc
    sh: "noinherit #1f364d" # LiteralStringHeredoc
    m: "noinherit #faac77" # LiteralNumber
    mb: "noinherit #faac77" # LiteralNumberBin
    mh: "noinherit #faac77" # LiteralNumberHex
    mi: "noinherit #faac77" # LiteralNumberInteger
    mf: "noinherit #faac77" # LiteralNumberFloat
    mo: "noinherit #faac77" # LiteralNumberOct
    o: "noinherit bold #b6f4ff" # Operator
    ow: "noinherit bold #b6f4ff" # OperatorWord
    c: "noinherit italic #1f364d" # Comment
    cs: "noinherit italic #1f364d" # CommentSingle
    cm: "noinherit italic #1f364d" # CommentMultiline
    cx: "noinherit italic #1f364d" # CommentSpecial
    ch: "noinherit italic #1f364d" # CommentHashbang
    cp: "noinherit italic #1f364d" # CommentPreproc
