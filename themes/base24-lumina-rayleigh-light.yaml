# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Lumina Rayleigh Light
# Scheme Author: Razik Ikhlef (https://github.com/RazikSF)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#056271"
    secondary: "# 0160a7"
    error: "#94171b"
    inactive: "#7b8891"
    success: "#1e773b"
  chromaStyleOverrides:
    bg: "noinherit #1d2f47 bg:#edf8ff"
    "": "noinherit #1d2f47"
    kc: "noinherit #7244a9" # Keyword.Constant
    kr: "noinherit #7244a9" # KeywordReserved
    kd: "noinherit #6c1f1d" # KeywordDeclaration
    kn: "noinherit #056271" # KeywordNamespace
    kt: "noinherit #6c1f1d" # KeywordType
    n: "noinherit #1d2f47" # Name
    nc: "noinherit #a35f00" # NameClass
    no: "noinherit #a35f00" # NameConstant
    ne: "noinherit #a14e14" # NameException
    nf: "noinherit #8d4487" # NameFunction
    nl: "noinherit #004d59" # NameLabel
    nn: "noinherit #a14e14" # NameNamespace
    py: "noinherit #a14e14" # NameProperty
    nt: "noinherit #94171b" # NameTag
    nv: "noinherit #3d4a52" # NameVariable
    vc: "noinherit #3d4a52" # NameVariableClass
    vg: "noinherit #3d4a52" # NameVariableGlobal
    vi: "noinherit #3d4a52" # NameVariableInstance
    na: "noinherit #8d4487" # NameAttribute
    nb: "noinherit #004d59" # NameBuiltin
    nx: "noinherit #1d2f47" # NameOther
    l: "noinherit #1d2f47" # Literal
    s: "noinherit #1e773b" # LiteralString
    sc: "noinherit #1e773b" # LiteralStringChar
    s1: "noinherit #1e773b" # LiteralStringSingle
    s2: "noinherit #1e773b" # LiteralStringDouble
    sb: "noinherit #1e773b" # LiteralStringBacktick
    sx: "noinherit #1e773b" # LiteralStringOther
    si: "noinherit #1e773b" # LiteralStringInterpol
    sr: "noinherit #056271" # LiteralStringRegex
    sd: "noinherit #c8d6df" # LiteralStringDoc
    sh: "noinherit #c8d6df" # LiteralStringHeredoc
    m: "noinherit #a14e14" # LiteralNumber
    mb: "noinherit #a14e14" # LiteralNumberBin
    mh: "noinherit #a14e14" # LiteralNumberHex
    mi: "noinherit #a14e14" # LiteralNumberInteger
    mf: "noinherit #a14e14" # LiteralNumberFloat
