    nl: "noinherit #004758" # NameLabel
    nn: "noinherit #a24e0f" # NameNamespace
    py: "noinherit #a24e0f" # NameProperty
    nt: "noinherit #941419" # NameTag
    nv: "noinherit #44484c" # NameVariable
    vc: "noinherit #44484c" # NameVariableClass
    vg: "noinherit #44484c" # NameVariableGlobal
    vi: "noinherit #44484c" # NameVariableInstance
    na: "noinherit #a43687" # NameAttribute
    nb: "noinherit #004758" # NameBuiltin
    nx: "noinherit #1d2638" # NameOther
    l: "noinherit #1d2638" # Literal
