    sx: "noinherit #327056" # LiteralStringOther
    si: "noinherit #327056" # LiteralStringInterpol
    sr: "noinherit #276e6c" # LiteralStringRegex
    sd: "noinherit #80616b" # LiteralStringDoc
    sh: "noinherit #80616b" # LiteralStringHeredoc
    m: "noinherit #9b5b19" # LiteralNumber
