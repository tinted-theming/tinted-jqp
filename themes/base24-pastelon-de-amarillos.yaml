    mh: "noinherit #9b5b19" # LiteralNumberHex
    mi: "noinherit #9b5b19" # LiteralNumberInteger
    mf: "noinherit #9b5b19" # LiteralNumberFloat
    mo: "noinherit #9b5b19" # LiteralNumberOct
    o: "noinherit bold #005eb8" # Operator
