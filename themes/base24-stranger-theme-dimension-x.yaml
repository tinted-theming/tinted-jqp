# vim: ft=yaml
# Scheme System: base24
# Scheme Name: Stranger Theme Dimension X
# Scheme Author: Stranger Theme (https://github.com/stranger-theme/stranger-theme)
# Template Author: tinted-jqp (https://github.com/tinted-theming/tinted-jqp)
theme:
  name: "native"
  styleOverrides:
    primary: "#7fb5b0"
    secondary: "# c678dd"
    error: "#ff6b6b"
    inactive: "#b8a5a5"
    success: "#8fae7e"
  chromaStyleOverrides:
    bg: "noinherit #e8d5d5 bg:#1e1a1a"
    "": "noinherit #e8d5d5"
    kc: "noinherit #ff55aa" # Keyword.Constant
    kr: "noinherit #ff55aa" # KeywordReserved
    kd: "noinherit #ff8989" # KeywordDeclaration
    kn: "noinherit #7fb5b0" # KeywordNamespace
    kt: "noinherit #ff8989" # KeywordType
    n: "noinherit #e8d5d5" # Name
    nc: "noinherit #d19a66" # NameClass
    no: "noinherit #d19a66" # NameConstant
    ne: "noinherit #ff6b6b" # NameException
    nf: "noinherit #d74343" # NameFunction
    nl: "noinherit #9dd3ce" # NameLabel
    nn: "noinherit #ff6b6b" # NameNamespace
    py: "noinherit #ff6b6b" # NameProperty
    nt: "noinherit #ff6b6b" # NameTag
    nv: "noinherit #f4e1e1" # NameVariable
    vc: "noinherit #f4e1e1" # NameVariableClass
    vg: "noinherit #f4e1e1" # NameVariableGlobal
    vi: "noinherit #f4e1e1" # NameVariableInstance
    na: "noinherit #d74343" # NameAttribute
    nb: "noinherit #9dd3ce" # NameBuiltin
    nx: "noinherit #e8d5d5" # NameOther
    l: "noinherit #e8d5d5" # Literal
    s: "noinherit #8fae7e" # LiteralString
    sc: "noinherit #8fae7e" # LiteralStringChar
    s1: "noinherit #8fae7e" # LiteralStringSingle
    s2: "noinherit #8fae7e" # LiteralStringDouble
    sb: "noinherit #8fae7e" # LiteralStringBacktick
    sx: "noinherit #8fae7e" # LiteralStringOther
    si: "noinherit #8fae7e" # LiteralStringInterpol
    sr: "noinherit #7fb5b0" # LiteralStringRegex
    sd: "noinherit #9a7c7c" # LiteralStringDoc
    sh: "noinherit #9a7c7c" # LiteralStringHeredoc
    m: "noinherit #ff6b6b" # LiteralNumber
    mb: "noinherit #ff6b6b" # LiteralNumberBin
    mh: "noinherit #ff6b6b" # LiteralNumberHex
    mi: "noinherit #ff6b6b" # LiteralNumberInteger
    mf: "noinherit #ff6b6b" # LiteralNumberFloat
    mo: "noinherit #ff6b6b" # LiteralNumberOct
    o: "noinherit bold #9dd3ce" # Operator
    ow: "noinherit bold #9dd3ce" # OperatorWord
    c: "noinherit italic #9a7c7c" # Comment
    cs: "noinherit italic #9a7c7c" # CommentSingle
    cm: "noinherit italic #9a7c7c" # CommentMultiline
    cx: "noinherit italic #9a7c7c" # CommentSpecial
    ch: "noinherit italic #9a7c7c" # CommentHashbang
    cp: "noinherit italic #9a7c7c" # CommentPreproc
